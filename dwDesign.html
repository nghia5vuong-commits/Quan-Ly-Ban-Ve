<style>
  /* ==========================================================================
     PAGE DWDESIGN - LIGHT LIQUID GLASS (iOS 27 Fluid Glassmorphism)
     ========================================================================== */
  .page-dwDesign {
    position: relative;
    background: transparent !important;
    padding: 4px !important;
  }

  .page-dwDesign .design-preview-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.42);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .page-dwDesign .design-preview-dialog {
    display: flex;
    flex-direction: column;
    width: min(1100px, 96vw);
    height: min(780px, 92vh);
    overflow: hidden;
    border: var(--liquid-border);
    border-radius: var(--liquid-radius-lg);
    background: var(--liquid-glass-elevated);
    box-shadow: var(--liquid-shadow-lg), var(--liquid-shadow-glow);
  }

  .page-dwDesign .design-preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    background: rgba(255, 255, 255, 0.78);
  }

  .page-dwDesign .design-preview-head h5 {
    margin: 0;
    color: var(--liquid-text);
    font-weight: 800;
  }

  .page-dwDesign .design-preview-head small {
    color: var(--liquid-text-muted);
  }

  .page-dwDesign .design-preview-body {
    flex: 1;
    min-height: 0;
    background: #f8fafc;
  }

  .page-dwDesign .design-preview-frame {
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }

  .page-dwDesign .design-preview-fallback {
    height: 100%;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 10px;
    color: var(--liquid-text-muted);
  }

  .page-dwDesign .design-preview-fallback i {
    font-size: 2.5rem;
    color: var(--liquid-primary);
  }

  /* App Cards & Glass Cards */
  .page-dwDesign .app-card,
  .page-dwDesign .glass-card {
    position: relative;
    overflow: hidden;
    background: var(--liquid-glass-elevated);
    backdrop-filter: var(--liquid-blur);
    -webkit-backdrop-filter: var(--liquid-blur);
    border: var(--liquid-border);
    border-radius: var(--liquid-radius-lg);
    box-shadow: var(--liquid-shadow-md), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
    padding: 22px;
    transition: var(--liquid-spring);
  }

  .page-dwDesign .app-card:hover,
  .page-dwDesign .glass-card:hover {
    box-shadow: var(--liquid-shadow-lg);
    border-color: rgba(16, 185, 129, 0.3);
  }

  /* Liquid Upload Zone Compact */
  .page-dwDesign .upload-zone {
    position: relative;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 60px;
    padding: 10px 14px;
    border: 2px dashed rgba(16, 185, 129, 0.35);
    border-radius: var(--liquid-radius-md);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(209, 250, 229, 0.45) 100%);
    backdrop-filter: var(--liquid-blur-subtle);
    -webkit-backdrop-filter: var(--liquid-blur-subtle);
    color: var(--liquid-text-soft);
    text-align: center;
    transition: var(--liquid-spring);
    cursor: pointer;
  }

  .page-dwDesign .upload-zone:hover {
    border-color: var(--liquid-primary);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(209, 250, 229, 0.8) 100%);
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 18px rgba(16, 185, 129, 0.15);
  }

  .page-dwDesign .upload-zone p {
    font-size: 0.78rem;
    font-weight: 600;
  }

  .page-dwDesign .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  /* Search Select Dropdown Liquid Glass */
  .page-dwDesign .search-select-wrapper {
    position: relative;
  }

  .page-dwDesign .search-select-input {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 42px;
    border: 1px solid rgba(203, 213, 225, 0.85);
    border-radius: var(--liquid-radius-sm);
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: var(--liquid-blur-subtle);
    -webkit-backdrop-filter: var(--liquid-blur-subtle);
    overflow: hidden;
    transition: var(--liquid-spring-fast);
  }

  .page-dwDesign .search-select-input:focus-within {
    border-color: var(--liquid-primary);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
    background: #ffffff;
  }

  .page-dwDesign .search-select-field {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--liquid-text);
    font-size: 0.88rem;
    padding: 8px 14px;
    outline: none;
  }

  .page-dwDesign .search-select-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 50;
    display: none;
    max-height: 240px;
    overflow-y: auto;
    background: var(--liquid-glass-elevated);
    backdrop-filter: var(--liquid-blur);
    -webkit-backdrop-filter: var(--liquid-blur);
    border: var(--liquid-border);
    border-radius: var(--liquid-radius-md);
    box-shadow: var(--liquid-shadow-lg);
    padding: 6px;
  }

  .page-dwDesign .search-select-wrapper.open .search-select-dropdown {
    display: block;
    animation: liquidFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Submit Button */
  .page-dwDesign .btn-submit {
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.4) !important;
    padding: 12px 20px;
    font-weight: 700;
    color: #ffffff !important;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
    box-shadow: 0 10px 24px rgba(16, 185, 129, 0.35) !important;
    border-radius: var(--liquid-radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: var(--liquid-spring);
  }

  .page-dwDesign .btn-submit:hover {
    background: linear-gradient(135deg, #34d399 0%, #059669 100%) !important;
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 28px rgba(16, 185, 129, 0.45) !important;
  }

  .page-dwDesign .btn-submit:active {
    transform: scale(0.96);
  }

  /* Compact Table Rows */
  .page-dwDesign .table-custom,
  .page-dwDesign table {
    font-size: 0.74rem !important;
  }

  .page-dwDesign table th {
    padding: 6px 8px !important;
    font-size: 0.68rem !important;
    white-space: nowrap !important;
    font-weight: 700 !important;
  }

  .page-dwDesign table td {
    padding: 5px 8px !important;
    font-size: 0.74rem !important;
    vertical-align: middle !important;
    line-height: 1.3 !important;
  }

  /* Compact nav pills */
  .page-dwDesign .nav-pills .nav-link {
    border-radius: var(--liquid-radius-pill);
    padding: 5px 12px;
    font-size: 0.73rem;
    font-weight: 600;
    color: var(--liquid-text-soft);
    border: 1px solid transparent;
    transition: var(--liquid-spring);
  }

  .page-dwDesign .nav-pills .nav-link.active {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
    border-color: rgba(255, 255, 255, 0.3);
    color: #ffffff !important;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  /* Compact submit button */
  .page-dwDesign .btn-submit {
    padding: 9px 16px;
    font-size: 0.82rem;
    font-weight: 700;
  }

  /* Scrollable table section */
  .page-dwDesign .table-responsive {
    max-height: calc(100vh - 320px) !important;
    overflow-y: auto !important;
  }

  /* Compact form labels */
  .page-dwDesign .form-label {
    font-size: 0.7rem !important;
    margin-bottom: 3px !important;
    font-weight: 700;
  }

  .page-dwDesign .form-control,
  .page-dwDesign .form-select {
    font-size: 0.8rem !important;
    padding: 6px 10px !important;
  }
</style>
<div class="page-dwDesign" style="width: 100%; margin: 0 !important; min-height: 100%; height: auto; overflow-y: auto;">
  <div class="design-preview-modal d-none" id="designPreviewModal" role="dialog" aria-modal="true"
    aria-labelledby="designPreviewTitle">
    <div class="design-preview-dialog">
      <div class="design-preview-head">
        <div>
          <h5 id="designPreviewTitle" data-i18n="design_preview_title">Xem trước bản vẽ</h5>
          <small id="designPreviewMeta" data-i18n="design_preview_meta">PDF preview</small>
        </div>
        <button type="button" class="btn btn-light border" onclick="closeDesignPreview()" aria-label="Đóng xem trước"><i
            class="bi bi-x-lg"></i></button>
      </div>
      <div class="design-preview-body" id="designPreviewBody"></div>
    </div>
  </div>
  <div class="row g-4">

    <!-- LEFT PANEL: TẢI FILE -->
    <div class="col-lg-4 col-xl-4">
      <div class="app-card">
        <h5 class="fw-bold mb-4 text-primary"><i class="bi bi-cloud-arrow-up-fill me-2"></i><span data-i18n="design_upload_title">Tải lên bản vẽ</span></h5>

        <form id="designUploadForm" onsubmit="handleDesignUpload(event)">
          <!-- ẨN ID ĐI NHƯNG VẪN GIỮ TRONG FORM ĐỂ CODE ĐỌC ĐƯỢC -->
          <input type="hidden" id="uploadDwId" required>

          <div class="row g-3 mb-4">
            <div class="col-12">
              <label class="form-label fw-semibold small text-muted" data-i18n="design_drawing_code">Drawing Code</label>

              <!-- DROPDOWN TÌM KIẾM MỚI -->
              <div class="search-select-wrapper" id="toWrapper">
                <div class="search-select-input" id="searchSelectInputContainer"
                  onclick="if(typeof toggleDropdownTo==='function')toggleDropdownTo()">
                  <input type="text" id="uploadDwTo" class="search-select-field fw-bold text-primary"
                    data-i18n-placeholder="design_drawing_placeholder" placeholder="Nhập / Chọn mã Drawing..." autocomplete="off"
                    oninput="if(typeof filterToList==='function')filterToList()"
                    onfocus="if(typeof openDropdownTo==='function')openDropdownTo()" required>
                  <i class="bi bi-chevron-down search-select-arrow" id="searchSelectArrow"
                    onclick="if(typeof toggleDropdownTo==='function'){toggleDropdownTo(); event.stopPropagation();}"></i>
                </div>
                <div class="search-select-dropdown custom-scrollbar" id="toDropdown">
                  <!-- Dữ liệu render từ JS -->
                </div>
              </div>

            </div>
            <div class="col-12">
              <label class="form-label fw-semibold small text-muted" data-i18n="design_group">Group</label>
              <input type="text" class="form-control bg-light" id="uploadCategory" data-i18n-placeholder="design_auto_fill" placeholder="Tự động điền..."
                readonly required>
            </div>
          </div>

          <!-- Upload EXCEL (Lưu lên Local Server) -->
          <div class="mb-3">
            <label class="form-label fw-bold text-success small mb-1"><i class="bi bi-file-earmark-excel-fill me-1"></i>
              File EXCEL (Bản vẽ)</label>
            <div class="upload-zone" id="excelZone">
              <i class="bi bi-file-excel fs-4 text-success"></i>
              <p class="mb-0 fw-medium" id="excelFileName" data-i18n="design_choose_excel">Kéo thả hoặc bấm để chọn Excel</p>
              <input type="file" id="excelFileInput" accept=".xlsx, .xls, .xlsm" required
                onchange="updateFileName('excelFileInput', 'excelFileName', 'text-success')">
            </div>
            <small class="text-muted" data-i18n="design_nas_note" style="font-size: 10.5px;">*Tự động lưu trữ vào ổ NAS QA.</small>
          </div>

          <button type="submit" class="btn btn-submit w-100 mt-2" id="btnSubmitDesign">
            <i class="bi bi-send-fill me-2"></i><span data-i18n="design_upload_button">TẢI FILE</span>
          </button>
        </form>
      </div>
    </div>

    <!-- RIGHT PANEL: DANH SÁCH BẢN VẼ -->
    <div class="col-lg-8 col-xl-8">
      <div class="app-card">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-list-task me-2 text-primary"></i><span data-i18n="design_pending_title">Danh sách bản vẽ chờ thiết kế</span></h5>

          <!-- Thanh tìm kiếm TO -->
          <div class="input-group shadow-sm" style="width: 250px;">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="searchToInput" data-i18n-placeholder="design_search_placeholder" placeholder="Tìm kiếm..."
              oninput="onSearchDesignInput()">
          </div>
        </div>

        <!-- TABS (ĐÃ THÊM ID ĐỂ JS CÓ THỂ TỰ ĐỘNG BẤM) -->
        <ul class="nav nav-pills mb-3 border-bottom pb-2" id="dwCategoryTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-btn-barsale" data-bs-toggle="pill" type="button"
              role="tab">Barsale</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-btn-oem" data-bs-toggle="pill" type="button" role="tab">OEM</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-btn-we" data-bs-toggle="pill" type="button" role="tab">WE SASH</button>
          </li>
          <li class="nav-item ms-auto">
            <button class="btn btn-sm btn-light border fw-medium text-secondary mt-1" data-refresh-design="true"><i
                class="bi bi-arrow-clockwise me-1"></i> Làm mới Data</button>
          </li>
        </ul>

        <!-- BẢNG DỮ LIỆU (Đã set sẵn chiều rộng các cột) -->
        <div class="table-responsive custom-scrollbar border rounded-3"
          style="max-height: calc(100vh - 290px); overflow-y: auto;">
          <table class="table-custom">
            <thead class="position-sticky top-0 z-1 shadow-sm">
              <tr>
                <th class="text-center" style="width: 3%">#</th>
                <th class="d-none">ID</th>
                <th class="d-none">Group</th>
                <th data-i18n="design_th_type" style="width: 8%">Type</th>
                <th data-i18n="design_th_to" style="width: 10%">To</th>
                <th data-i18n="design_th_dw_code" style="width: 20%">Dw Code</th>
                <th class="text-center" data-i18n="design_th_version" style="width: 5%">Ver</th>
                <th data-i18n="design_th_project" style="width: 15%">Project</th>
                <th data-i18n="design_th_customer" style="width: 15%">Customer</th>
                <th class="text-center" data-i18n="design_th_excel" style="width: 8%">Excel Sample</th>
                <th class="text-center" data-i18n="design_th_pdf" style="width: 6%">PDF</th>
                <th class="text-center" data-i18n="design_th_action" style="width: 10%">Action</th>
              </tr>
            </thead>
            <tbody id="dwDesignTableBody">
              <!-- Nội dung Render từ JS -->
            </tbody>
          </table>
        </div>

        <!-- PAGINATION TOOLBAR -->
        <div id="dwDesignPaginationToolbar"
          class="d-flex flex-wrap justify-content-between align-items-center mt-3 pt-2 border-top gap-2">
          <div class="text-muted small" id="dwDesignPaginationInfo" data-i18n="design_pagination_empty">Hiển thị 0 - 0 / 0 bản vẽ</div>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-secondary rounded-2" id="dwDesignPrevBtn"
              onclick="changeDwDesignPage(-1)">
              <i class="bi bi-chevron-left me-1"></i> <span data-i18n="design_prev">Trang trước</span>
            </button>
            <span class="fw-bold small px-2 text-dark" id="dwDesignPageIndicator">1 / 1</span>
            <button class="btn btn-sm btn-outline-secondary rounded-2" id="dwDesignNextBtn"
              onclick="changeDwDesignPage(1)">
              <span data-i18n="design_next">Trang sau</span> <i class="bi bi-chevron-right ms-1"></i>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  let currentTabDesign = 'BARSALE';
  let globalToList = []; // Mảng chứa dữ liệu cho ô Dropdown nhập TO
  let currentlySelectedId = null; // Biến lưu lại ID dòng đang được click chọn
  let dwDesignTabsInitialized = false;
  let dwDesignInitGuard = false;

  function cleanDesignStr(val) {
    if (!val) return '';
    return String(val)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd')
      .trim();
  }

  function isDesignPendingStatus(statusRaw) {
    if (!statusRaw) return false;
    const st = cleanDesignStr(statusRaw);
    return st.includes('dang thuc hien')
      || st.includes('cho thiet ke')
      || st.includes('tra ve charger')
      || st.includes('tra ve')
      || st.includes('tra lai')
      || st.includes('tu choi');
  }

  function isDesignRejectedStatus(statusRaw) {
    if (!statusRaw) return false;
    const st = cleanDesignStr(statusRaw);
    return st.includes('tra ve') || st.includes('tra lai') || st.includes('tu choi');
  }

  function getDesignPageData() {
    var raw = [];
    if (Array.isArray(window.pageData) && window.pageData.length > 0) raw = window.pageData;
    else if (typeof pageData !== 'undefined' && Array.isArray(pageData) && pageData.length > 0) raw = pageData;
    else if (typeof AppDataStore !== 'undefined' && typeof AppDataStore.get === 'function') {
      var storeData = AppDataStore.get('mainData');
      if (Array.isArray(storeData) && storeData.length > 0) raw = storeData;
    }
    if (!Array.isArray(raw) || raw.length === 0) return [];
    if (raw.length > 0 && Array.isArray(raw[0]) && String(raw[0][0] || '').toLowerCase().trim() === 'id') {
      return raw.slice(1);
    }
    return raw;
  }

  document.querySelector('.page-dwDesign').addEventListener('click', function (event) {
    var previewButton = event.target.closest('[data-dw-preview]');
    if (previewButton) {
      event.preventDefault();
      event.stopPropagation();
      openDesignPreview(previewButton.dataset.previewUrl, 'Xem trước bản vẽ PDF');
      return;
    }
    var refreshButton = event.target.closest('[data-refresh-design]');
    if (refreshButton) {
      var tbody = document.getElementById('dwDesignTableBody');
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="12" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm text-primary me-2"></span>Đang làm mới dữ liệu...</td></tr>';
      }
      if (typeof AppDataStore !== 'undefined' && typeof AppDataStore.invalidate === 'function') {
        AppDataStore.invalidate('mainData');
      } else {
        initThietKeBanVe();
      }
      return;
    }
  });

  function openDesignPreview(url, title) {
    var modal = document.getElementById('designPreviewModal');
    var body = document.getElementById('designPreviewBody');
    var titleEl = document.getElementById('designPreviewTitle');
    if (!modal || !body || !url) return;
    var safeUrl = String(url).replace(/&amp;/g, '&').replace(/"/g, '&quot;');
    if (titleEl) titleEl.textContent = title || 'Xem trước bản vẽ';
    body.innerHTML = '<iframe class="design-preview-frame" src="' + safeUrl + '" title="Xem trước PDF"></iframe>';
    modal.classList.remove('d-none');
  }

  function closeDesignPreview() {
    var modal = document.getElementById('designPreviewModal');
    var body = document.getElementById('designPreviewBody');
    if (body) body.innerHTML = '';
    if (modal) modal.classList.add('d-none');
  }

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeDesignPreview();
  });

  // Cập nhật tên file khi chọn
  function updateFileName(inputId, labelId, colorClass) {
    const input = document.getElementById(inputId);
    const label = document.getElementById(labelId);
    if (input.files.length > 0) {
      label.innerHTML = `<span class="fw-bold ${colorClass}">${input.files[0].name}</span>`;
    }
  }

  // ==========================================
  // XỬ LÝ DROPDOWN TÌM KIẾM MÃ TO
  // ==========================================
  function buildToDropdownList() {
    const data = getDesignPageData();
    if (!Array.isArray(data) || data.length === 0) {
      renderToDropdown([]);
      return;
    }
    const dwDesignData = data.filter(row => Array.isArray(row) && isDesignPendingStatus(row[2]));

    // Khởi tạo map
    window._dwDesignRowMap = window._dwDesignRowMap || {};

    // Tạo mảng từ pageData
    globalToList = dwDesignData.map((row, idx) => {
      const rawId = String(row[0] || '').trim();
      const rawDw = String(row[11] || '').trim(); // Cột L: Drawing code
      const rawTo = String(row[8] || '').trim();  // Cột I: TO
      const phanLoai = String(row[3] || '');      // Cột D: Group
      // Nếu row[0] trống, dùng DW Code hoặc TO làm định danh
      const id = rawId || rawDw || rawTo || String(idx + 2);
      const display = rawDw || rawTo || id; // Ưu tiên DwNo -> TO -> ID
      // Lưu vào map để auto-find lúc submit
      const mapEntry = { id, dwCode: rawDw, to: rawTo, cat: phanLoai };
      window._dwDesignRowMap[id] = mapEntry;
      if (rawDw) window._dwDesignRowMap[rawDw.toLowerCase()] = mapEntry;
      if (rawTo) window._dwDesignRowMap[rawTo.toLowerCase()] = mapEntry;
      return { id, phanLoai, display };
    });
    renderToDropdown(globalToList);
  }

  function toggleDropdownTo() {
    var el = document.getElementById('toWrapper');
    if (el) el.classList.toggle('open');
  }
  function openDropdownTo() {
    var el = document.getElementById('toWrapper');
    if (el) el.classList.add('open');
  }
  function closeDropdownTo() {
    var el = document.getElementById('toWrapper');
    if (el) el.classList.remove('open');
  }

  // Gắn trực tiếp lên window để HTML inline luôn gọi được
  window.toggleDropdownTo = toggleDropdownTo;
  window.openDropdownTo = openDropdownTo;
  window.closeDropdownTo = closeDropdownTo;

  function renderToDropdown(list) {
    const dropdown = document.getElementById('toDropdown');
    if (!dropdown) return;
    if (!list || list.length === 0) {
      dropdown.innerHTML = '<div class="search-select-empty">Không tìm thấy mã nào!</div>';
      return;
    }
    dropdown.innerHTML = list.map(item => {

    else if (catUpper.includes('OEM')) targetTab = 'OEM';

      else if (targetTab === 'OEM') tabIdToClick = 'tab-btn-oem';

  // Logic tính toán màu sắc cho Deadline
  function getDeadlineStatus(deadlineStr) {
    if (!deadlineStr || deadlineStr === '') return { html: '-', class: '' };

    const deadline = new Date(deadlineStr);
    if (isNaN(deadline)) return { html: deadlineStr, class: 'text-secondary' };

    const now = new Date();
    now.setHours(0, 0, 0, 0);
    deadline.setHours(0, 0, 0, 0);

    const diffTime = deadline - now;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    let statusClass = 'text-success fw-bold'; // Mặc định xanh (Còn hạn)
    let icon = '<i class="bi bi-clock"></i>';

    if (diffDays < 0) {
      statusClass = 'text-danger fw-bold'; // Vượt hạn -> Đỏ
      icon = '<i class="bi bi-exclamation-octagon-fill"></i>';
    } else if (diffDays <= 1) {
      statusClass = 'text-warning text-dark fw-bold'; // Gấp (Còn 0-1 ngày) -> Vàng
      icon = '<i class="bi bi-exclamation-triangle-fill"></i>';
    }

    const dateFormatted = deadline.toLocaleDateString('vi-VN');
    return { html: `<div class="${statusClass} mb-1" style="font-size: 11px;">${icon} ${dateFormatted}</div>` };
  }

  function updateDwDesignPaginationUI(total, start, end, page, totalPages) {
    const infoEl = document.getElementById('dwDesignPaginationInfo');

    const nextBtn = document.getElementById('dwDesignNextBtn');

  window._dwDesignPdfMap = window._dwDesignPdfMap || {};

  var isFetchingDesignData = false;
  function loadDrawingList() {
    const tbody = document.getElementById('dwDesignTableBody');
    if (!tbody) return;
    const searchTo = (document.getElementById('searchToInput')?.value || '').toLowerCase().trim();
    const data = getDesignPageData();

    if (!Array.isArray(data) || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm text-primary me-2"></span>Đang chờ tải dữ liệu bản vẽ...</td></tr>';
      updateDwDesignPaginationUI(0, 0, 0, 1, 1);

      // AppDataStore là nguồn dữ liệu duy nhất. Không gọi getMainData() riêng
      // tại đây vì request đó sẽ đọc toàn bộ Sheet lần nữa.
      if (typeof AppDataStore !== 'undefined' && typeof AppDataStore.ensure === 'function') {
        AppDataStore.ensure('mainData');
      }
      return;
    }

    let dataRows = data.filter(row => Array.isArray(row) && isDesignPendingStatus(row[2]));

    // Lọc theo Tab (Phân loại - Dùng Cột D index 3: Group - Barsale, OEM, WE SASH)
    dataRows = dataRows.filter(r => {
      const cat = String(r[3] || '').trim().toUpperCase();
      if (currentTabDesign === 'BARSALE' && cat.includes('BARSALE')) return true;
      if (currentTabDesign === 'OEM' && cat.includes('OEM')) return true;
      if (currentTabDesign === 'WE SASH') {
        if (!cat.includes('BARSALE') && !cat.includes('OEM')) return true;
      }
      return false;
    });

    // Lọc theo Ô tìm kiếm bảng
    if (searchTo) {
      dataRows = dataRows.filter(r => {
        const toVal = (String(r[8] || '') + " " + String(r[4] || '') + " " + String(r[11] || '') + " " + String(r[10] || '') + " " + String(r[9] || '')).toLowerCase();
        return toVal.includes(searchTo);
      });
    }

    if (dataRows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="12" class="text-center py-5 text-muted">Không có bản vẽ nào trong mục này.</td></tr>';
      updateDwDesignPaginationUI(0, 0, 0, 1, 1);
      return;
    }

    // Phân trang
    const totalItems = dataRows.length;
    const totalPages = Math.ceil(totalItems / dwDesignPageSize) || 1;
    if (dwDesignCurrentPage < 1) dwDesignCurrentPage = 1;
    if (dwDesignCurrentPage > totalPages) dwDesignCurrentPage = totalPages;

    const startIdx = (dwDesignCurrentPage - 1) * dwDesignPageSize;
    const endIdx = startIdx + dwDesignPageSize;
    const pageRows = dataRows.slice(startIdx, endIdx);

    // Khởi tạo map lưu dw/to theo id (để auto-find khi submit)
    window._dwDesignRowMap = window._dwDesignRowMap || {};

    let html = '';
    pageRows.forEach((row, idx) => {
      const i = startIdx + idx;
      // Nếu row[0] (Cột A = ID) trống, tự dùng DW Code hoặc TO làm định danh
      const rawId = String(row[0] || '').trim();
      const rawDw = String(row[11] || '').trim();
      const rawTo = String(row[8] || '').trim();
      const id = rawId || rawDw || rawTo || String(i + 2); // fallback: dòng spreadsheet
      const phanLoai = row[3];
      const project = row[9];
      const to = row[8];
      const ver = row[12];
      const type = row[4];
      const dwNo = row[11];
      const deadlineStr = row[7];
      const excelThamKhao = row[30];
      const pdfGuiKy = row[31];
      const customer = row[10];
      const statusRaw = String(row[2] || '').trim();
      const isRejected = isDesignRejectedStatus(statusRaw);

      // Nút Xem Tham Khảo
      const btnExcelTK = (excelThamKhao && String(excelThamKhao).includes('http'))
        ? `<a href="${excelThamKhao}" target="_blank" class="btn btn-sm btn-light border py-0 px-2 text-success" title="Xem Excel"><i class="bi bi-file-excel-fill"></i></a>` : '-';

      // Nút PDF Gửi Ký       
      let btnPdfGuiKy = '';
      let canSubmit = false;
      const noteRaw = String(row[22] || '').trim();
      // Extract rejection reason from note if rejected
      let rejectReason = '';
      if (isRejected && noteRaw) {
        var tuChoiMatch = noteRaw.match(/TU CHOI:\s*([^\n\[]+)/i);
        if (tuChoiMatch && tuChoiMatch[1]) rejectReason = tuChoiMatch[1].trim();
        else if (noteRaw.length < 200) rejectReason = noteRaw.split('\n')[0];
      }
      if (pdfGuiKy && String(pdfGuiKy).includes('http')) {
        btnPdfGuiKy = `<a href="${pdfGuiKy}" target="_blank" class="btn btn-sm btn-primary py-0 px-2"><i class="bi bi-eye"></i> Xem</a>`;
        canSubmit = true;
      } else {
        btnPdfGuiKy = `<span class="badge bg-warning text-dark">Chưa có link</span>`;
      }

      // Lưu PDF URL và thông tin dòng vào map để guiKyDuyetById & auto-find đọc lại
      if (id) {
        window._dwDesignPdfMap[id] = String(pdfGuiKy || '');
        // Lưu map: dwCode -> id và to -> id để auto-find khi submit
        window._dwDesignRowMap[id] = { id, dwCode: rawDw, to: rawTo, cat: String(row[3] || '') };
        if (rawDw) window._dwDesignRowMap[rawDw.toLowerCase()] = window._dwDesignRowMap[id];
        if (rawTo) window._dwDesignRowMap[rawTo.toLowerCase()] = window._dwDesignRowMap[id];
      }

      // Nút Gửi Ký & Deadline
      const dStatus = getDeadlineStatus(deadlineStr);
      let btnGuiKy = '';
      if (canSubmit) {
        btnGuiKy = `<button class="btn btn-sm btn-success w-100 fw-bold" data-dw-id="${id}" onclick="event.stopPropagation(); guiKyDuyetById(this)"><i class="bi bi-send"></i> ${isRejected ? 'Gửi ký lại' : 'Gửi ký'}</button>`;
      } else if (isRejected) {
        btnGuiKy = `<span class="badge bg-danger w-100 py-1" title="${statusRaw}"><i class="bi bi-exclamation-triangle-fill me-1"></i>Trả về charger</span>`;
      } else {
        btnGuiKy = `<span class="badge bg-secondary w-100 py-1">Đang thực hiện</span>`;
      }

      // Tự động Add class 'selected-row' nếu dòng này trùng với dòng đang được chọn
      const isSelected = (id === currentlySelectedId) ? 'selected-row' : '';
      const rowWarningClass = isRejected ? 'bg-danger bg-opacity-10' : '';

      var safeId = String(id || '').replace(/'/g, "\\'");
      var safeCat = String(phanLoai || '').replace(/'/g, "\\'");
      var safeDisp = String(rawDw || rawTo || '').replace(/'/g, "\\'");

      // Tạo HTML dòng
      html += `
       <tr id="row-${id}" class="dw-table-row ${isSelected} ${rowWarningClass}" onclick="selectDrawingToUpload('${safeId}', '${safeCat}', '${safeDisp}')" title="Nhấp để tải file cho bản vẽ này">
         <td class="text-center text-muted fw-bold">${i + 1}</td>
         <td class="d-none">${id}</td> 
         <td class="d-none"><span class="badge bg-secondary bg-opacity-10 text-secondary border">${phanLoai}</span></td>
         <td>${type}</td>
         <td>${to}</td>
         <td class="fw-bold text-dark">
           ${dwNo}
           ${isRejected ? `<span class="badge bg-danger-subtle text-danger border border-danger-subtle ms-1" style="font-size: 10px;">Bị trả lại</span>` : ''}
           ${isRejected && rejectReason ? `<div class="text-danger mt-1" style="font-size: 11px; font-weight: 400;"><i class="bi bi-chat-left-text me-1"></i>${rejectReason.substring(0, 120)}${rejectReason.length > 120 ? '...' : ''}</div>` : ''}
         </td>
         <td class="text-center">${ver}</td>
         <td>${project}</td>
         <td>${customer}</td>
         <td class="text-center">${btnExcelTK}</td>
         <td class="text-center">${btnPdfGuiKy}</td>
         <td class="text-center px-2">
            ${dStatus.html}
            ${btnGuiKy}
         </td>
       </tr>
       `;
    });
    tbody.innerHTML = html;
    updateDwDesignPaginationUI(totalItems, startIdx, endIdx, dwDesignCurrentPage, totalPages);
  }

  // Wrapper đọc pdfUrl từ map thay vì inject URL vào onclick (tránh URL Google Drive bị break)
  function guiKyDuyetById(btnEl) {
    if (_isSigningDesign) return;
    const id = btnEl.getAttribute('data-dw-id');
    const pdfUrl = (window._dwDesignPdfMap && window._dwDesignPdfMap[id]) || '';

      return;
    }
    guiKyDuyet(id, pdfUrl, btnEl);

  // Sự kiện gửi trình ký
  async function guiKyDuyet(id, pdfUrl, triggerBtn) {
    if (_isSigningDesign) return;

    Swal.fire({
      title: 'Xác nhận Gửi ký?',
      text: `Hệ thống sẽ tự động đóng dấu và gửi duyệt bản vẽ này.`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'Đồng ý',
      cancelButtonText: 'Hủy'
    }).then(async (result) => {
      if (result.isConfirmed) {
        if (_isSigningDesign) return;
        _isSigningDesign = true;

        if (triggerBtn) {
          triggerBtn.disabled = true;
          triggerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Đang gửi...';
        }

        try {
          showDwDesignLoading("BƯỚC 1/3: Đang lấy dữ liệu từ Google Drive...");

          // 1. Lấy Base64 của PDF và Chữ ký từ GAS
          const fileData = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .getFilesFromDrive(pdfUrl, user.mail);
          });

          if (!fileData || !fileData.success) {
            throw new Error(fileData ? fileData.message : "Không thể lấy dữ liệu từ Google Drive.");
          }

          showDwDesignLoading("BƯỚC 2/3: Local API đang đóng dấu bản vẽ...");

          const pdfBlob = await fetch("data:application/pdf;base64," + fileData.pdfBase64).then(res => res.blob());
          const stampBlob = await fetch("data:image/png;base64," + fileData.stampBase64).then(res => res.blob());

          // 2. Gửi cho Local FastAPI (Python Backend tự động tìm ô và đóng dấu theo chức vụ level)
          let posKey = String(user.position || 'chager').toLowerCase().replace(/\s+/g, '');
          const formData = new FormData();
          formData.append("pdf_file", pdfBlob, "document.pdf");
          formData.append("stamp_file", stampBlob, "stamp.png");
          formData.append("level", posKey);

          const localApiUrl = "http://10.156.42.195:8000/quan-ly-ban-ve/signToPDW";
          const apiResponse = await fetch(localApiUrl, {
            method: "POST",
            body: formData
          });

          if (!apiResponse.ok) throw new Error("Local API trả về lỗi HTTP " + apiResponse.status);

          showDwDesignLoading("BƯỚC 3/3: Đang lưu bản vẽ đã ký lên hệ thống...");

          // 4. Lấy file PDF đã ký về và chuyển sang Base64
          const signedPdfBlob = await apiResponse.blob();
          const base64SignedPdf = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const base64String = reader.result.split(',')[1];
              resolve(base64String);
            };
            reader.readAsDataURL(signedPdfBlob);
          });

          // 5. Gửi Base64 lên GAS để lưu và chuyển trạng thái
          const saveRes = await new Promise((resolve, reject) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              .submitForApproval(id, base64SignedPdf);
          });

          // Thành công
          hideDwDesignLoading();
          Swal.fire({
            title: 'Thành công',
            html: `Bản vẽ đã được đóng dấu và chuyển sang Chờ Checker xác nhận!<br><br><a href="${saveRes}" target="_blank" class="btn btn-sm btn-primary fw-bold text-white px-3 py-2 mt-2 shadow-sm"><i class="bi bi-file-earmark-pdf-fill me-1"></i> Xem ngay bản vẽ vừa ký</a>`,
            icon: 'success'
          });

          if (typeof AppDataStore !== 'undefined') AppDataStore.invalidate('mainData');

          // Tải lại bảng để mất bản vẽ vừa gửi
          if (typeof loadDrawingList === 'function') loadDrawingList();

        } catch (error) {
          hideDwDesignLoading();
          Swal.fire('Lỗi Ký Duyệt', error.message, 'error');
        } finally {
          _isSigningDesign = false;
          hideDwDesignLoading();
          if (triggerBtn) {
            triggerBtn.disabled = false;
            triggerBtn.innerHTML = '<i class="bi bi-send"></i> Gửi ký';
          }
        }

      }
    });
  }

  window.guiKyDuyetById = guiKyDuyetById;
  window.guiKyDuyet = guiKyDuyet;
  window.handleDesignUpload = handleDesignUpload;
  window.updateFileName = updateFileName;
  window.openDesignPreview = openDesignPreview;
  window.closeDesignPreview = closeDesignPreview;
  window.changeDwDesignPage = changeDwDesignPage;
  window.onSearchDesignInput = onSearchDesignInput;

  // Lắng nghe AppDataStore cập nhật (AppDataStore được định nghĩa sau dwDesign trong index.html nên cần cơ chế retry)
  function attachAppDataStoreListener() {
    if (typeof AppDataStore !== 'undefined' && typeof AppDataStore.onReady === 'function') {
      AppDataStore.onReady('mainData', function (data) {
        if (Array.isArray(data) && data.length > 0) {
          window.pageData = data;
          if (typeof pageData !== 'undefined') pageData = data;
        }
        window.requestAnimationFrame(initThietKeBanVe);
      });
      return true;
    }
    return false;
  }

  if (!attachAppDataStoreListener()) {
    var storeTimer = setInterval(function () {
      if (attachAppDataStoreListener()) {
        clearInterval(storeTimer);
      }
    }, 200);
  }

  // Tự động kiểm tra và vẽ lại khi tab dwDesign hiển thị
  (function setupDesignTabAutoObserver() {
    var checkAndRender = function () {
      var container = document.getElementById('index-page-dwDesign');
      if (container && container.classList.contains('active')) {
        var tbody = document.getElementById('dwDesignTableBody');
        if (!tbody || tbody.children.length === 0 || tbody.innerText.includes('Đang chờ tải')) {
          window.requestAnimationFrame(initThietKeBanVe);
        }
      }
    };

    var pageEl = document.getElementById('index-page-dwDesign');
    if (pageEl && typeof MutationObserver !== 'undefined') {
      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          if (m.attributeName === 'class') {
            checkAndRender();
          }
        });
      });
      observer.observe(pageEl, { attributes: true });
    }

    // Polling nhẹ phòng ngừa trường hợp chuyển tab không qua switchTab
    var intervalCount = 0;
    var initInterval = setInterval(function () {
      intervalCount++;
      var container = document.getElementById('index-page-dwDesign');
      var tbody = document.getElementById('dwDesignTableBody');
      if (container && container.classList.contains('active')) {
        if (!tbody || tbody.children.length === 0) {
          window.requestAnimationFrame(initThietKeBanVe);
        }
      }
      if (intervalCount >= 10 && tbody && tbody.children.length > 0) {
        clearInterval(initInterval);
      }
      if (intervalCount >= 20) {
        clearInterval(initInterval);
      }
    }, 1000);
  })();

  // initThietKeBanVe() được gọi từ index.html qua AppDataStore.onReady('mainData')

  // ==========================================
  // XỬ LÝ UPLOAD CHÍNH CỦA FORM BÊN TRÁI
  // ==========================================
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
      reader.onerror = error => reject(error);
    });
  }

  async function signUploadedPdfAsCharge(rowId, pdfUrl) {
    if (!pdfUrl || !pdfUrl.includes('http')) {
      throw new Error('Bản vẽ chưa có đường dẫn PDF để ký ở vị trí Charge.');
    }

    const userMail = (typeof user !== 'undefined' && user && user.mail) ? user.mail : 'System';
    const fileData = await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .getFilesFromDrive(pdfUrl, userMail);
    });

    if (!fileData || !fileData.success || !fileData.pdfBase64 || !fileData.stampBase64) {
      throw new Error(fileData ? (fileData.message || fileData.error || 'Không lấy được PDF/Chữ ký từ Drive.') : 'Không lấy được PDF/Chữ ký từ Drive.');
    }

    const pdfBlob = await fetch('data:application/pdf;base64,' + fileData.pdfBase64).then(res => res.blob());
    const stampBlob = await fetch('data:image/png;base64,' + fileData.stampBase64).then(res => res.blob());

    const formData = new FormData();
    formData.append('pdf_file', pdfBlob, 'document.pdf');
    formData.append('stamp_file', stampBlob, 'stamp.png');
    formData.append('level', 'charger');

    const localApiUrl = 'http://10.156.42.195:8000/quan-ly-ban-ve/signToPDW';
    const apiResponse = await fetch(localApiUrl, {
      method: 'POST',
      body: formData
    });

    if (!apiResponse.ok) {
      throw new Error(`Local API ký Charge lỗi HTTP ${apiResponse.status}.`);
    }

    const contentType = String(apiResponse.headers.get('content-type') || '').toLowerCase();
    if (!contentType.includes('application/pdf') && !contentType.includes('application/octet-stream')) {
      const errorText = await apiResponse.text();
      throw new Error(`Local API ký Charge không trả đúng PDF. ${errorText ? 'Chi tiết: ' + errorText : ''}`);
    }

    const signedPdfBlob = await apiResponse.blob();
    if (!signedPdfBlob || signedPdfBlob.size < 64) {
      throw new Error('Local API ký Charge trả về PDF rỗng hoặc quá nhỏ.');
    }

    const base64SignedPdf = await blobToBase64(signedPdfBlob);
    const signedPdfUrl = await new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .submitForApproval(rowId, base64SignedPdf);
    });

    return signedPdfUrl || pdfUrl;
  }


  async function handleDesignUpload(event) {
    event.preventDefault();
    if (_isUploadingDesign) return;

    let id = document.getElementById('uploadDwId').value;
    const excelFile = document.getElementById('excelFileInput').files[0];
    const fileName = (document.getElementById("uploadDwTo").value || '').trim();
    const btnSubmit = document.getElementById('btnSubmitDesign');

    if (!id && fileName) {
      const mapEntry = window._dwDesignRowMap && window._dwDesignRowMap[fileName.toLowerCase()];
      if (mapEntry) {
        id = mapEntry.id;
        document.getElementById('uploadDwId').value = id;
        if (!document.getElementById('uploadCategory').value) {
          document.getElementById('uploadCategory').value = mapEntry.cat || '';
        }
      } else {
        const data = getDesignPageData();
        const matched = data.find(row => {
          if (!Array.isArray(row)) return false;
          const dwNo = String(row[11] || '').trim();
          const toNo = String(row[8] || '').trim();
          const rowId = String(row[0] || '').trim();
          return (dwNo && dwNo.toLowerCase() === fileName.toLowerCase())
            || (toNo && toNo.toLowerCase() === fileName.toLowerCase())
            || (rowId && rowId.toLowerCase() === fileName.toLowerCase());
        });
        if (matched) {
          const rawId = String(matched[0] || '').trim();
          const rawDw = String(matched[11] || '').trim();
          const rawTo = String(matched[8] || '').trim();
          id = rawId || rawDw || rawTo;
          document.getElementById('uploadDwId').value = id;
          if (!document.getElementById('uploadCategory').value) {
            document.getElementById('uploadCategory').value = String(matched[3] || '');
          }
        }
      }
    }

    if (!fileName) {
      return Swal.fire('Cảnh báo', 'Vui lòng chọn hoặc nhập Mã bản vẽ / Mã TO!', 'warning');
    }
    if (!id) {
      return Swal.fire('Cảnh báo', 'Không xác định được ID bản vẽ tương ứng với mã "' + fileName + '". Vui lòng nhấp chọn dòng bản vẽ từ bảng bên phải!', 'warning');
    }
    if (!excelFile) {
      return Swal.fire('Cảnh báo', 'Vui lòng chọn File EXCEL bản vẽ!', 'warning');
    }

    try {
      _isUploadingDesign = true;
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>ĐANG TẢI LÊN...';
      }
      showDwDesignLoading('Đang upload Excel và chuyển đổi PDF bằng backend...');

      const formData = new FormData();
      formData.append('id', id);
      formData.append('filename', fileName);
      formData.append('file', excelFile);

      const LOCAL_SERVER_URL = "http://10.156.42.195:8000/quan-ly-ban-ve/xlsx_to_pdf";
      const localResponse = await fetch(LOCAL_SERVER_URL, {
        method: 'POST',
        body: formData
      });

      if (!localResponse.ok) {
        throw new Error(`Lỗi máy chủ Local: HTTP ${localResponse.status}`);
      }

      const contentType = String(localResponse.headers.get('content-type') || '').toLowerCase();
      if (!contentType.includes('application/pdf')) {
        throw new Error('Backend chưa trả đúng PDF binary với content-type application/pdf.');
      }

      const pdfBlob = await localResponse.blob();
      const pdfBase64 = await blobToBase64(pdfBlob);
      const excelBase64 = await fileToBase64(excelFile);

      const rowEntry = (window._dwDesignRowMap && window._dwDesignRowMap[id])
        || (window._dwDesignRowMap && window._dwDesignRowMap[fileName.toLowerCase()])
        || null;
      const sendDwCode = (rowEntry && rowEntry.dwCode) || fileName || '';
      const sendToCode = (rowEntry && rowEntry.to) || '';

      const driveLinks = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .uploadPdfDesignToDrive(pdfBase64, excelBase64, `${sendDwCode || id}.pdf`, `${sendDwCode || id}.xlsx`, id, sendDwCode, sendToCode);
      });

      if (!driveLinks || !driveLinks.pdfUrl || !driveLinks.excelUrl) {
        throw new Error('Backend PDF/Excel đã convert nhưng Apps Script chưa trả về link Drive cần thiết.');
      }

      const pdfUrl = driveLinks.pdfUrl;
      const excelUrl = driveLinks.excelUrl;

      // Khi Excel upload xong, vừa sinh PDF ở Drive vừa tự ký ở vị trí Charge trong dwDesign,
      // không cần chờ vào màn hình submitDW.js.
      let chargeSignedPdfUrl = pdfUrl;
      try {
        chargeSignedPdfUrl = await signUploadedPdfAsCharge(id, pdfUrl);
      } catch (sigErr) {
        console.error('Charge signing after upload failed:', sigErr);
        // Không block upload chính nếu backend ký phụ này thất bại, nhưng cảnh báo rõ.
        Swal.fire('Cảnh báo ký Charge', (sigErr && sigErr.message) ? sigErr.message : String(sigErr), 'warning');
      }

      if (typeof pageData !== 'undefined') {
        const rowIndex = pageData.findIndex(row => {
          if (!Array.isArray(row)) return false;
          const rId = String(row[0] || '').trim();
          const rDw = String(row[11] || '').trim();
          const rTo = String(row[8] || '').trim();
          return (id && rId && rId === String(id).trim())
            || (sendDwCode && rDw && rDw.toLowerCase() === sendDwCode.toLowerCase())
            || (sendToCode && rTo && rTo.toLowerCase() === sendToCode.toLowerCase());
        });
        if (rowIndex !== -1) {
          pageData[rowIndex][2] = 'Chờ Checker';
          pageData[rowIndex][30] = excelUrl;
          pageData[rowIndex][31] = pdfUrl;
        }
      }

      if (id) {
        window._dwDesignPdfMap = window._dwDesignPdfMap || {};
        window._dwDesignPdfMap[id] = chargeSignedPdfUrl || pdfUrl;
      }
      if (typeof AppDataStore !== 'undefined') AppDataStore.invalidate('mainData');

      hideDwDesignLoading();
      Swal.fire({
        title: 'Thành công!',
        html: `Đã lưu file lên hệ thống, sinh PDF và ký ở vị trí Charge trong dwDesign.<br><br><b>Link PDF:</b> <a href="${chargeSignedPdfUrl || pdfUrl}" target="_blank" class="btn btn-sm btn-outline-primary mt-2">Xem ngay</a>`,
        icon: 'success'
      });

      document.getElementById('designUploadForm').reset();
      document.getElementById('uploadDwId').value = '';
      document.getElementById('uploadCategory').value = '';
      document.getElementById('uploadDwTo').value = '';
      document.getElementById('excelFileName').innerText = 'Kéo thả hoặc bấm để chọn Excel';

      currentlySelectedId = null;
      loadDrawingList();

    } catch (error) {
      hideDwDesignLoading();
      Swal.fire('Lỗi Tải lên', error.message, 'error');
    } finally {
      _isUploadingDesign = false;
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="bi bi-send-fill me-2"></i>TẢI FILE';
      }
      hideDwDesignLoading();
    }
  }
</script>
