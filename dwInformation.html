              <div class="row g-3">
                <div class="col-md-3 col-sm-6">
                  <label class="form-label fw-semibold">Width (mm)</label>
                  <input type="number" id="formWidth" class="form-control" placeholder="0" />
                </div>
                <div class="col-md-3 col-sm-6">
                  <label class="form-label fw-semibold">Height (mm)</label>
                  <input type="number" id="formHeight" class="form-control" placeholder="0" />
                </div>
                <div class="col-md-6 col-sm-12">
                  <label class="form-label fw-semibold">Hình ảnh mặt cắt (File/Link)</label>
                  <input type="file" id="formImageFile" class="form-control" accept="image/*" />
                  <small class="text-muted d-block mt-2">Preview:</small>
                  <img id="formImagePreview" src="" alt="Preview" class="img-thumbnail mt-2" style="display: none; max-height: 200px;" />
                </div>
              </div>
            </div>

            <div class="col-md-3 col-sm-6">
              <label class="form-label fw-semibold">Ngày ĐT hoàn thành</label>
              <input type="date" id="formAssigneeDoneDate" class="form-control" />
            </div>
          </div>
        </div>

        <div class="modal-footer bg-light border-top p-3">
          <button type="submit" class="btn btn-primary px-4 shadow-sm fw-bold"><i class="fa fa-floppy-disk me-2"></i>Lưu
            Dữ Liệu</button>
        </div>
      </form>
    </div>
  </div>
</div>


<script>
  /* ==========================================================================
     HÀM TIỆN ÍCH
     ========================================================================== */
  function escHtml(str) {
    if (!str && str !== 0) return '';
    try {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    } catch (e) {
      console.error('escHtml error:', e, 'value:', str);
      return '';
    }
  }
  function setText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val !== undefined ? val : '–'; }

  function showToast(message, type) {
    type = type || 'success';
    var container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div'); container.id = 'toastContainer'; container.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;'; document.body.appendChild(container);
    }
    var bg = type === 'error' ? '#fee2e2' : type === 'warning' ? '#fef9c3' : '#dcfce7', border = type === 'error' ? '#f87171' : type === 'warning' ? '#fde047' : '#4ade80', color = type === 'error' ? '#991b1b' : type === 'warning' ? '#854d0e' : '#166534';
    var icon = type === 'error' ? '<i class="fa fa-circle-xmark me-2"></i>' : type === 'warning' ? '<i class="fa fa-triangle-exclamation me-2"></i>' : '<i class="fa fa-circle-check me-2"></i>';
    var toast = document.createElement('div');
    toast.style.cssText = 'background:' + bg + '; border:1px solid ' + border + '; color:' + color + '; padding:12px 20px; border-radius:8px; font-size:14px; font-weight:600; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); pointer-events:auto; transition:opacity 0.3s; display:flex; align-items:center;';
    toast.innerHTML = icon + '<span>' + escHtml(message) + '</span>';
    container.appendChild(toast);
    setTimeout(function () { toast.style.opacity = '0'; setTimeout(function () { toast.remove(); }, 300); }, 4000);
  }

  /* ==========================================================================
     MODULE 1.1: NHẬN THÔNG TIN MAIL (ÁP DỤNG PROMISE ĐỂ CHẠY SONG SONG)
     ========================================================================== */
  var state = { emails: [], currentPage: 0, totalEmails: 0, hasMore: false, selectedId: null, keyword: '', currentEmailDetail: null };

  function initThongTinBanVe() {
    loadEmailsAndStats(0);
  }

  async function loadEmailsAndStats(page) {
    loadingRequests++;
    state.currentPage = page;

    try {
      // Bắn 2 luồng xuống máy chủ cùng một lúc bằng Promise.all
      const [emailRes, statsRes] = await Promise.all([
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getManufacturingEmails(page, state.keyword);
        }),
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getStatistics();
        })
      ]);

      hideLoading(); // <--- TẮT LOADING

      // Xử lý kết quả Email
      if (!emailRes || !emailRes.success) {
        showToast('Lỗi tải danh sách: ' + (emailRes ? emailRes.error : 'rỗng'), 'error');
      } else {
        state.emails = emailRes.emails;
        state.totalEmails = emailRes.total;
        state.hasMore = emailRes.hasMore;
        renderEmailList(emailRes.emails);
        renderPagination(emailRes);
      }

      // Xử lý kết quả Thống Kê
      if (statsRes && statsRes.success) {
        setText('statTotal', statsRes.total);
        setText('statUnread', statsRes.unread);
        setText('statToday', statsRes.today);
        setText('statWeek', statsRes.thisWeek);
      }
    } catch (err) {
      hideLoading(); // <--- TẮT LOADING NẾU CÓ LỖI
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
    }
  }

  function searchEmails() {
    var input = document.getElementById('searchInput');
    if (input) state.keyword = input.value.trim();
    loadEmailsAndStats(0);
  }

  function changePage(dir) {
    var newPage = state.currentPage + dir;
    if (newPage < 0) return;
    loadEmailsAndStats(newPage);
  }

  function updateSidebarStatus(threadId, isReceived) {
    // 1. Cập nhật trạng thái trong mảng data để khi chuyển trang không bị mất
    var emailObj = state.emails.find(function (e) { return e.id === threadId; });
    if (emailObj) emailObj.isReceived = isReceived;

    // 2. Tìm thẻ HTML ở danh sách bên trái và đổi class màu
    var sidebarItem = document.querySelector('#emailList .email-item[onclick*="' + threadId + '"]');
    if (sidebarItem) {
      if (isReceived) {
        sidebarItem.classList.remove('status-pending');
        sidebarItem.classList.add('status-received');
      } else {
        sidebarItem.classList.remove('status-received');
        sidebarItem.classList.add('status-pending');
      }
    }
  }

  function renderEmailList(emails) {
    var list = document.getElementById('emailList');
    if (!list) return;
    if (!emails || emails.length === 0) {
      list.innerHTML = '<div class="text-center text-muted py-5"><i class="fa fa-inbox fs-4 mb-2"></i><br><small>Không tìm thấy email</small></div>'; return;
    }

    // 1. Sắp xếp danh sách: Chưa tiếp nhận (false/undefined) lên đầu, Đã tiếp nhận (true) xuống cuối
    var sortedEmails = emails.slice().sort(function (a, b) {
      var aStatus = a.isReceived ? 1 : 0;
      var bStatus = b.isReceived ? 1 : 0;
      return aStatus - bStatus;
    });

    // 2. Render HTML
    var htmlBuffer = [];
    for (var i = 0; i < sortedEmails.length; i++) {
      var email = sortedEmails[i];
      var isActive = email.id === state.selectedId ? ' active' : '';
      var isUnread = email.isUnread ? ' unread' : '';

      var statusClass = email.isReceived ? ' status-received' : ' status-pending';

      var dot = email.isUnread ? '<span class="position-absolute top-0 start-0 translate-middle p-1 bg-primary border border-light rounded-circle" style="margin-top:20px; margin-left:10px;"></span>' : '';

      htmlBuffer.push(
        '<div class="email-item position-relative' + isActive + isUnread + statusClass + '" onclick="openEmail(\'' + email.id + '\'); return false;">' +
        dot +
        '<div class="d-flex justify-content-between align-items-center mb-1">' +
        '<span class="email-sender text-truncate pe-2" style="font-size:0.9rem;">' + escHtml(String(email.senderName || email.senderEmail)) + '</span>' +
        '<small class="text-muted text-nowrap" style="font-size:0.75rem;">' + escHtml(String(email.date)) + '</small>' +
        '</div>' +
        '<div class="email-subject text-secondary text-truncate" style="font-size:0.85rem;">' + escHtml(String(email.subject)) + '</div>' +
        '</div>'
      );
    }
    list.innerHTML = htmlBuffer.join('');
  }

  function renderPagination(data) {
    var pag = document.getElementById('pagination'); if (!pag) return;
    if (data.total <= 100) { pag.classList.replace('d-flex', 'd-none'); return; }
    pag.classList.replace('d-none', 'd-flex');
    document.getElementById('prevBtn').disabled = state.currentPage === 0;
    document.getElementById('nextBtn').disabled = !data.hasMore;
  }

  async function openEmail(threadId) {
    if (state.selectedId === threadId) return;
    state.selectedId = threadId;
    document.querySelectorAll('#emailList .email-item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('onclick').includes(threadId));
    });

    showLoading('Đang tải nội dung email...');

    try {
      const [detailRes, statusRes] = await Promise.all([
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getEmailDetail(threadId);
        }),
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).checkEmailReceived(threadId);
        })
      ]);

      hideLoading();

      if (!detailRes || !detailRes.success) {
        return showToast('Lỗi tải nội dung: ' + (detailRes ? detailRes.error : 'rỗng'), 'error');
      }

      renderEmailDetail(detailRes);

      var badgeEl = document.getElementById('receivedBadge');
      if (badgeEl && statusRes && statusRes.success && statusRes.isReceived) {
        badgeEl.innerHTML = '<span class="badge bg-success bg-opacity-10 text-success border border-success ms-2 align-middle" style="font-size:0.75rem;"><i class="fa fa-check-circle me-1"></i>Đã tiếp nhận</span>';

        var btn = document.getElementById('btnTiepNhan');
        if (btn) btn.classList.add('d-none');

        // BỔ SUNG ĐỒNG BỘ MÀU XANH CHO SIDEBAR
        updateSidebarStatus(threadId, true);
      }

      google.script.run.withSuccessHandler(function (statsData) {
        if (statsData && statsData.success) setText('statUnread', statsData.unread);
      }).getStatistics();

    } catch (err) {
      hideLoading();
      showToast('Lỗi xử lý email: ' + err.message, 'error');
    }
  }

  function renderEmailDetail(data) {
    state.currentEmailDetail = data;
    var firstMsg = data.messages[0];
    var subject = data.subject || '(Không có tiêu đề)';

    // Kiểm tra nhanh trạng thái tiếp nhận từ danh sách email
    var currentEmail = state.emails.find(function (e) { return e.id === data.threadId; });
    var isReceived = currentEmail ? currentEmail.isReceived : false;

    // Render Huy hiệu & Nút bấm dựa trên trạng thái
    var badgeHtml = '<span id="receivedBadge">' +
      (isReceived ? '<span class="badge bg-success bg-opacity-10 text-success border border-success ms-2 align-middle" style="font-size:0.75rem;"><i class="fa fa-check-circle me-1"></i>Đã tiếp nhận</span>' : '') +
      '</span>';

    var btnHtml = isReceived ? '' :
      '<button id="btnTiepNhan" class="btn btn-primary shadow-sm text-nowrap" onclick="handleTiepNhanThietKe()">' +
      '<i class="fa fa-file-signature me-2"></i>Tiếp nhận thiết kế' +
      '</button>';

    var headerHtml =
      '<div class="d-flex justify-content-between align-items-start gap-3">' +
      '<h4 class="fw-bold text-dark mb-0 lh-base">' + escHtml(subject) + badgeHtml + '</h4>' +
      btnHtml +
      '</div>' +
      '<div class="d-flex align-items-center mt-4">' +
      '<div class="bg-white border text-secondary rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm" style="width:45px;height:45px;font-size:20px;font-weight:bold;">' +
      (firstMsg.senderName[0] || '?').toUpperCase() +
      '</div>' +
      '<div>' +
      '<div class="fw-bold text-dark fs-6">' + escHtml(String(firstMsg.senderName)) + ' <span class="text-muted fw-normal" style="font-size:0.85rem;">&lt;' + escHtml(String(firstMsg.senderEmail)) + '&gt;</span></div>' +
      '<small class="text-muted"><i class="fa fa-calendar-alt me-1"></i> ' + escHtml(String(firstMsg.date)) + '</small>' +
      '</div>' +
      '</div>';

    document.getElementById('detailHeader').innerHTML = headerHtml;

    var bodyHtml = data.messages.map(function (msg, idx) {
      var safeBody = escHtml(String(msg.plainBody || ''));

      var urlRegex = /((?:https?:\/\/|www\.)[^\s]+)/ig;
      var links = [];
      var match;
      while ((match = urlRegex.exec(safeBody)) !== null) {
        var cleanUrl = match[1].replace(/(&quot;|&lt;|&gt;|&amp;|[.,;)])+$/g, '');
        if (links.indexOf(cleanUrl) === -1) { links.push(cleanUrl); }
      }

      var formattedBody = safeBody.replace(urlRegex, function (m) {
        var cUrl = m.replace(/(&quot;|&lt;|&gt;|&amp;|[.,;)])+$/g, '');
        var trailing = m.substring(cUrl.length);
        var href = cUrl.toLowerCase().indexOf('http') === 0 ? cUrl : 'https://' + cUrl;
        return '<a href="' + href + '" target="_blank" class="text-decoration-none">' + cUrl + '</a>' + trailing;
      });

      var linksFooterHtml = '';
      if (links.length > 0) {
        linksFooterHtml = '<div class="mt-4 pt-3 border-top">' +
          '<h6 class="fw-bold text-dark mb-2" style="font-size:0.85rem;"><i class="fa fa-link me-2 text-primary"></i>Liên kết trong email:</h6>' +
          '<div class="d-flex flex-wrap gap-2">';
        for (var i = 0; i < links.length; i++) {
          var linkUrl = links[i];
          var linkHref = linkUrl.toLowerCase().indexOf('http') === 0 ? linkUrl : 'https://' + linkUrl;
          var displayUrl = linkUrl.length > 40 ? linkUrl.substring(0, 40) + '...' : linkUrl;
          linksFooterHtml += '<a href="' + linkHref + '" target="_blank" class="btn btn-sm btn-outline-primary rounded-pill py-1 px-3 shadow-sm text-decoration-none" style="font-size:0.85rem;"><i class="fa fa-external-link-alt me-2"></i>' + displayUrl + '</a>';
        }
        linksFooterHtml += '</div></div>';
      }

      var attachmentsFooterHtml = '';
      if (msg.attachments && msg.attachments.length > 0) {
        attachmentsFooterHtml = '<div class="mt-3 pt-3 border-top">' +
          '<h6 class="fw-bold text-dark mb-2" style="font-size:0.85rem;"><i class="fa fa-paperclip me-2 text-primary"></i>File đính kèm:</h6>' +
          '<div class="d-flex flex-wrap gap-2">';
        for (var j = 0; j < msg.attachments.length; j++) {
          var att = msg.attachments[j];
          var attName = escHtml(String(att.name || 'Tập tin không tên'));
          var iconClass = att.isSheet ? 'fa-file-excel text-success' : 'fa-file text-secondary';
          attachmentsFooterHtml += '<button type="button" onclick="viewAttachment(\'' + data.threadId + '\', ' + idx + ', ' + j + ', \'' + attName.replace(/'/g, "\\'") + '\')" class="btn btn-sm btn-light border p-2 px-3 d-flex align-items-center shadow-sm rounded-pill text-dark hover-card" style="font-size:0.85rem; transition: all 0.2s;" title="Nhấn để xem"><i class="fa ' + iconClass + ' me-2 fs-6"></i>' + attName + '</button>';
        }
        attachmentsFooterHtml += '</div></div>';
      }

      return '<div class="card mb-4 border-0 shadow-sm rounded-4 overflow-hidden">' +
        '<div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between">' +
        '<span class="fw-bold text-secondary"><i class="fa fa-reply fa-rotate-180 me-2 text-primary"></i>' + escHtml(String(msg.senderName)) + '</span>' +
        '<small class="text-muted">' + escHtml(String(msg.date)) + '</small>' +
        '</div>' +
        '<div class="card-body pt-2 text-dark" style="font-size:14px;white-space:pre-wrap;line-height:1.6;">' +
        formattedBody + linksFooterHtml + attachmentsFooterHtml +
        '</div></div>';
    }).join('');

    document.getElementById('detailBody').innerHTML = bodyHtml;
    document.getElementById('emptyState').classList.replace('d-flex', 'd-none');
    document.getElementById('detailContent').classList.replace('d-none', 'd-flex');
  }

  function viewAttachment(threadId, msgIndex, attIndex, fileName) {
    showLoading('Đang tải file từ server...');

    // Mở tab mới ngay lập tức
    var viewerTab = window.open('', '_blank');
    if (!viewerTab) {
      hideLoading();
      return showToast('Vui lòng tắt trình chặn Popup (Popup Blocker) cho trang này.', 'error');
    }

    // Hiển thị giao diện chờ trên Tab mới
    viewerTab.document.write('<title>Đang tải...</title><div style="font-family:sans-serif; padding: 30px; text-align:center; color:#64748b; margin-top: 50px;"><h3>Đang tải dữ liệu file...</h3><p>Vui lòng đợi trong giây lát.</p></div>');

    google.script.run
      .withSuccessHandler(function (res) {
        hideLoading();
        if (res && res.success && res.dataBase64) {
          try {
            // Tối ưu hóa việc giải mã Base64 cho file lớn bằng cách cắt nhỏ (chunking)
            var byteCharacters = atob(res.dataBase64);
            var byteArrays = [];
            var sliceSize = 512;

            for (var offset = 0; offset < byteCharacters.length; offset += sliceSize) {
              var slice = byteCharacters.slice(offset, offset + sliceSize);
              var byteNumbers = new Array(slice.length);
              for (var i = 0; i < slice.length; i++) {
                byteNumbers[i] = slice.charCodeAt(i);
              }
              var byteArray = new Uint8Array(byteNumbers);
              byteArrays.push(byteArray);
            }

            // Tạo Blob URL
            var blob = new Blob(byteArrays, { type: res.mimeType });
            var blobUrl = URL.createObjectURL(blob);

            // Render iframe full màn hình vào Tab mới thay vì đổi location.href
            viewerTab.document.body.style.margin = '0';
            viewerTab.document.body.style.overflow = 'hidden';
            viewerTab.document.title = fileName; // Cập nhật tên Tab bằng tên file
            viewerTab.document.body.innerHTML = '<iframe src="' + blobUrl + '" style="width:100vw; height:100vh; border:none;"></iframe>';

          } catch (e) {
            viewerTab.close();
            showToast('Lỗi xử lý file trên trình duyệt: ' + e.message, 'error');
          }
        } else {
          viewerTab.close();
          showToast('Lỗi tải file: ' + (res ? res.error : 'Không có dữ liệu trả về'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        hideLoading();
        viewerTab.close();
        showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
      })
      .getAttachmentForDownload(threadId, msgIndex, attIndex);
  }

  function handleTiepNhanThietKe() {
    var data = state.currentEmailDetail;
    if (!data) return showToast('Vui lòng chọn email!', 'error');

    var msgIndex = -1, attIndex = -1;
    for (var i = 0; i < data.messages.length; i++) {
      if (data.messages[i].attachments) {
        for (var j = 0; j < data.messages[i].attachments.length; j++) {
          if (data.messages[i].attachments[j].isSheet) { msgIndex = i; attIndex = j; break; }
        }
      }
      if (msgIndex !== -1) break;
    }

    showLoading('Đang bóc tách file Excel và lưu vào tab Log...');

    if (msgIndex !== -1 && attIndex !== -1) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return hideLoading();
          if (!res.success || !res.dataBase64) { hideLoading(); return showToast('Lỗi đọc file đính kèm', 'error'); }
          try {
            var workbook = XLSX.read(res.dataBase64, { type: 'base64', cellDates: true });
            var sheet = workbook.Sheets[workbook.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
            var headerRowIdx = -1, colSO = -1, colCustomer = -1, colMaterial = -1;
            for (var r = 0; r < rows.length; r++) {
              if (!rows[r]) continue;
              for (var c = 0; c < rows[r].length; c++) {
                var val = String(rows[r][c] || '').trim().toLowerCase();
                if (val === 'sales document') { headerRowIdx = r; colSO = c; }
                if (val === 'item descr.') { headerRowIdx = r; colCustomer = c; }
                if (val === 'material') { colMaterial = c; }
              }
              if (headerRowIdx !== -1) break;
            }
            var parsedData = { so: '', customer: '', to: '' };
            if (headerRowIdx !== -1 && rows.length > headerRowIdx + 1) {
              var dataRow = rows[headerRowIdx + 1];
              if (colSO !== -1 && dataRow[colSO]) parsedData.so = 'SO' + String(dataRow[colSO]).replace(/[^0-9]/g, '');
              if (colCustomer !== -1 && dataRow[colCustomer]) parsedData.customer = String(dataRow[colCustomer]).trim().toUpperCase();
              if (colMaterial !== -1 && dataRow[colMaterial]) {
                var rawMat = String(dataRow[colMaterial]).trim();
                parsedData.to = rawMat.length > 1 ? rawMat.substring(1) : rawMat;
              }
            }
            google.script.run.withSuccessHandler(function (sRes) {
              hideLoading();
              if (!sRes) return;
              if (sRes.success) {
                showToast('Tiếp nhận dữ liệu thành công!', 'success');
                document.getElementById('receivedBadge').innerHTML = '<span class="badge bg-success bg-opacity-10 text-success border border-success ms-2 align-middle" style="font-size:0.75rem;"><i class="fa fa-check-circle me-1"></i>Đã tiếp nhận</span>';

                var btn = document.getElementById('btnTiepNhan');
                if (btn) btn.classList.add('d-none');

                updateSidebarStatus(data.threadId, true);

                // THÊM LOGIC ĐẨY THÔNG BÁO Ở ĐÂY
                if (typeof appLogSystem === 'function') {
                  var notiMsg = "Đã tiếp nhận bản vẽ " + (parsedData.so || "") + (parsedData.customer ? " của khách hàng " + parsedData.customer : "");
                  appLogSystem(notiMsg);
                }
              }
              else showToast('Lỗi: ' + sRes.error, 'error');
            }).saveToLogSheet(data.threadId, data.subject, parsedData, JSON.stringify(rows));
          } catch (e) { hideLoading(); showToast('Lỗi parse file Excel', 'error'); }
        }).getAttachmentParsedData(data.threadId, msgIndex, attIndex);
    } else {
      google.script.run.withSuccessHandler(function (sRes) {
        hideLoading();
        if (!sRes) return;
        if (sRes.success) {
          showToast('Đã tiếp nhận thành công (Không có file Excel)!', 'success');
          document.getElementById('receivedBadge').innerHTML = '<span class="badge bg-success bg-opacity-10 text-success border border-success ms-2 align-middle" style="font-size:0.75rem;"><i class="fa fa-check-circle me-1"></i>Đã tiếp nhận</span>';

          var btn = document.getElementById('btnTiepNhan');
          if (btn) btn.classList.add('d-none');

          updateSidebarStatus(data.threadId, true);

          // THÊM LOGIC ĐẨY THÔNG BÁO Ở ĐÂY
          if (typeof appLogSystem === 'function') {
            appLogSystem("Đã tiếp nhận bản vẽ từ email: " + (data.subject || ""));
          }
        }
        else showToast('Lỗi: ' + sRes.error, 'error');

  async function initNhapDuLieuBanVe() {
    loadingRequests++;
    closeDrawingForm();
    try {
      const res = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getDrawingsWithoutImage();
      });

      hideLoading(); // <--- TẮT LOADING
      console.log('[initNhapDuLieuBanVe] Response:', res);
      
      if (!res) {
        console.warn('Response rỗng từ getDrawingsWithoutImage, fallback sang getPendingLogData');
        // Fallback nếu hàm mới chưa deploy
        return initPendingDataFallback();
      }
      
      if (res.success) {
        console.log('✅ Dữ liệu thành công, total:', res.data?.length || 0);
        renderPendingList(res.data);
      } else {
        console.error('❌ Error từ backend:', res.error);
        showToast('Lỗi tải danh sách: ' + res.error, 'error');
        // Fallback
        return initPendingDataFallback();
      }
    } catch (err) {
      hideLoading(); // <--- TẮT LOADING NẾU CÓ LỖI
      console.error('[initNhapDuLieuBanVe] Lỗi:', err.message);
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
      // Fallback
      return initPendingDataFallback();
    }
  }

  // Fallback - gọi hàm cũ nếu getDrawingsWithoutImage không sẵn dùng
  function initPendingDataFallback() {
    console.log('[Fallback] Đang gọi getPendingLogData thay vì getDrawingsWithoutImage...');
    google.script.run
      .withSuccessHandler(function (res) {
        hideLoading();
        console.log('[Fallback] Response:', res);
        if (res && res.success) {
          renderPendingList(res.data);
        }
      })
      .withFailureHandler(function (err) {
        hideLoading();
        console.error('[Fallback] Error:', err.message);
        showToast('Lỗi tải dữ liệu: ' + err.message, 'error');
      })
      .getPendingLogData();
  }

  function renderDrawingTable(data) {
    pendingState.selectedLogIdx = null;

    var tbody = document.getElementById('drawingTableBody');
    var emptyState = document.getElementById('emptyTableState');
    if (!tbody || !emptyState) return;

    if (!data || data.length === 0) {
      tbody.innerHTML = '';
      emptyState.classList.remove('d-none');
    } else {
      emptyState.classList.add('d-none');
      var html = data.map(function (item) {
        var type = escHtml(String(item.type || 'New'));
        var to = escHtml(String(item.to || 'N/A'));
        var dwCode = escHtml(String(item.dwCode || 'DW-V2-01V'));
        var customer = escHtml(String(item.customer || 'Unknown'));
        var id = item.rowIdx;
        var subject = escHtml(String(item.subject || '')).replace(/'/g, "\\'");
        var soRaw = String(item.so || '');

        // Kiểm tra xem Mã SO đã tồn tại trong sheet Data hay chưa
        var exists = !!item.existsInData;
        if (!exists && soRaw) {
          var cleanSo = String(soRaw).trim().toUpperCase().replace(/\s+/g, "");
          var digitsSo = cleanSo.replace(/[^0-9]/g, "");
          if (window.pageDataSoSet && window.pageDataSoSet.size > 0) {
            exists = (cleanSo && window.pageDataSoSet.has(cleanSo)) || (digitsSo && window.pageDataSoSet.has(digitsSo));
          } else if (window.pageData && Array.isArray(window.pageData)) {
            exists = window.pageData.some(function (r) {
              if (!Array.isArray(r)) return false;
              var rSo8 = String(r[8] || '').trim().toUpperCase().replace(/\s+/g, "");
              var rSo4 = String(r[4] || '').trim().toUpperCase().replace(/\s+/g, "");
              return (cleanSo && (rSo8.indexOf(cleanSo) !== -1 || rSo4.indexOf(cleanSo) !== -1)) || 
                     (digitsSo && (rSo8.indexOf(digitsSo) !== -1 || rSo4.indexOf(digitsSo) !== -1));
            });
          }
        }

        var actionHtml = '';
        if (exists) {
          // Đã tồn tại trong Data -> Ẩn nút Sửa/Xóa, Hiện nút Tìm kiếm bản vẽ đóng gói
          var imgUrl = escHtml(String(item.imageUrl || ''));
          var safeSo = escHtml(soRaw).replace(/'/g, "\\'");
          actionHtml = '<button class="btn btn-sm btn-outline-primary fw-bold shadow-sm" onclick="handleSearchPackagingDrawing(\'' + imgUrl + '\', \'' + safeSo + '\')" title="Tìm kiếm bản vẽ đóng gói">' +
            '<i class="fa fa-search me-1"></i>Tìm kiếm</button>';
        } else {
          // Chưa có trong Data -> Hiện nút Sửa & Xóa
          actionHtml = '<div class="btn-group shadow-sm">' +
            '<button class="btn btn-sm btn-light border text-primary" onclick="openEditDrawingForm(' + id + ', \'' + subject + '\', \'' + customer + '\', \'' + to + '\', \'' + escHtml(soRaw).replace(/'/g, "\\'") + '\')" title="Sửa"><i class="fa fa-pen me-1"></i>Sửa</button>' +
            '<button class="btn btn-sm btn-light border text-danger" onclick="deleteDrawing(' + id + ')" title="Xóa"><i class="fa fa-trash me-1"></i>Xóa</button>' +
            '</div>';
        }

        return '<tr class="bg-white" style="transition: all 0.2s;">' +
          '<td class="ps-4 fw-bold text-dark">' + type + '</td>' +
          '<td><span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle px-2 py-1">' + to + '</span></td>' +
          '<td><code class="text-danger bg-light px-2 py-1 rounded fw-bold border">' + dwCode + '</code></td>' +
          '<td class="text-secondary fw-medium">' + customer + '</td>' +
          '<td class="text-end pe-4">' + actionHtml + '</td>' +
          '</tr>';
      }).join('');
      tbody.innerHTML = html;
    }
  }

  function handleSearchPackagingDrawing(imageUrl, so) {
    // 1. Tự động chuyển giao diện sang Tab "Tìm Kiếm Bản Vẽ Bằng AI"
    var navBtn = document.getElementById('nav-btn-seachDwByAi');
    if (typeof switchTab === 'function') {
      switchTab('seachDwByAi', navBtn);
    }

    // 2. Tra cứu imageUrl từ pageData nếu chưa có từ server
    if (!imageUrl && window.pageData && Array.isArray(window.pageData) && so) {
      var cleanSo = String(so).trim().toUpperCase().replace(/\s+/g, "");
      var digitsSo = cleanSo.replace(/[^0-9]/g, "");
      for (var i = 0; i < window.pageData.length; i++) {
        var r = window.pageData[i];
        if (!Array.isArray(r)) continue;
        if (r[32] && typeof r[32] === 'string' && r[32].length > 10) {
          var rSo8 = String(r[8] || '').trim().toUpperCase().replace(/\s+/g, "");
          var rSo4 = String(r[4] || '').trim().toUpperCase().replace(/\s+/g, "");
          if ((cleanSo && (rSo8.indexOf(cleanSo) !== -1 || rSo4.indexOf(cleanSo) !== -1)) || 
              (digitsSo && (rSo8.indexOf(digitsSo) !== -1 || rSo4.indexOf(digitsSo) !== -1))) {
            imageUrl = r[32];
            break;
          }
        }
      }
    }

    var defaultImg = "https://img.icons8.com/?size=100&id=Wy3XKG1CjyKf&format=png&color=000000";
    var finalImg = imageUrl || defaultImg;

    // 3. Thực thi kích hoạt dán ảnh và tìm kiếm trên seachDwByAi
    setTimeout(function () {
      if (typeof window.executeSearchWithImage === 'function') {
        window.executeSearchWithImage(finalImg);
      } else {
        var preview = document.getElementById('previewImage');
        var loaderImg = document.getElementById('loaderOriginalImg');
        var container = document.getElementById('previewContainer');
        if (preview) preview.src = finalImg;
        if (loaderImg) loaderImg.src = finalImg;
        if (container) container.classList.add('has-image');

        if (typeof uploadAndSearch === 'function') {
          uploadAndSearch();
        } else {
          showToast('Đã dán ảnh thành công vào trang tìm kiếm!', 'success');
        }
      }
    }, 150);
  }

      }
      var oldContainer = document.getElementById('form-container-' + pendingState.selectedLogIdx);
      if (oldContainer) oldContainer.classList.add('d-none');
    }

    pendingState.selectedLogIdx = rowIdx;
    pendingState.subject = subject;

    form.reset();
    var rDate = document.getElementById('formReceivedDate');
    if (rDate) rDate.value = new Date().toISOString().split('T')[0];

    btn.classList.replace('btn-outline-primary', 'btn-primary');

  function handleDrawingFormSubmit(e) {
    e.preventDefault();

    // Lấy Element an toàn để tránh lỗi null value
    var getVal = function (id) {
      var el = document.getElementById(id);
      return el ? el.value : "";
    };

    var toValue = getVal('formTO');
    if (!toValue && pendingState && pendingState.selectedLogIdx && typeof pendingState.selectedLogIdx === 'number') {
      var currentRow = drawingDataList.find(function (item) {
        return Number(item.rowIdx) === Number(pendingState.selectedLogIdx);
      });
      if (currentRow && currentRow.to) toValue = String(currentRow.to);
    }

    // Mảng 17 trường theo đúng thứ tự Form mới
    var rowData = [
      getVal('formGroup'),            // 0: Group
      getVal('formType'),             // 1: Type
      getVal('formCustomer'),         // 2: Customer
      toValue,                        // 3: TO
      getVal('formProject'),          // 4: Dự án
      getVal('formSO'),               // 5: Số SO
      getVal('formDwCode'),           // 6: Dw Code
      getVal('formVersion'),          // 7: Version
      getVal('formTypeDw'),           // 8: Type DW
      getVal('formAssignee'),         // 9: Người đảm trách
      getVal('formWidth'),            // 10: Width
      getVal('formHeight'),           // 11: Height
      getVal('formReceivedDate'),     // 12: Ngày tiếp nhận
      getVal('formAssigneeDoneDate'), // 13: Ngày ĐT hoàn thành
      getVal('formActualDoneDate'),   // 14: Ngày HT thực tế (An toàn nếu rỗng)
      getVal('formFYE'),              // 15: FYE
      getVal('formNote')              // 16: Note
    ];

    var form = document.getElementById('drawingForm');
    var fileInput = form ? form.querySelector('input[type="file"]') : null;
    var file = (fileInput && fileInput.files.length > 0) ? fileInput.files[0] : null;

    showLoading('Đang xử lý dữ liệu và lưu...');

    if (file) {
      var reader = new FileReader();
      reader.onload = function (event) {
        var base64String = event.target.result.split(',')[1];
        var imageObj = { base64: base64String, mimeType: file.type, name: file.name };
        rowData.push(imageObj);
        sendDataToGas(rowData);
      };
      reader.onerror = function () {
        hideLoading();
        showToast('Không thể đọc file hình ảnh', 'error');
      };
      reader.readAsDataURL(file);
    } else {
      rowData.push(null);
      sendDataToGas(rowData);
    }
  }

  function sendDataToGas(rowData) {
    google.script.run
      .withSuccessHandler(function (res) {
        hideLoading();
        if (!res) return showToast('Lỗi phản hồi rỗng', 'error');
        if (res.success) {
          showToast('Đã lưu thành công!', 'success');
          closeDrawingForm();
          
          // Nếu là chế độ upgrade (nâng cấp bản vẽ) thì nhảy sang tab manage
          if (pendingState.isUpgradeMode) {
            pendingState.isUpgradeMode = false;  // Reset flag
            setTimeout(function () {
              // Reload dữ liệu manage drawings
              loadManagedDrawings();
              // Nhảy sang tab 3 (Quản lí bản vẽ)
              var manageTabBtn = document.getElementById('manage-tab');
              if (manageTabBtn) {
                var manageTab = new bootstrap.Tab(manageTabBtn);

          }
          
          if (typeof AppDataStore !== 'undefined') AppDataStore.invalidate('mainData');
        }
        else showToast('Lỗi lưu sheet: ' + res.error, 'error');
      })
      .withFailureHandler(function (err) {
        hideLoading();
        showToast('Lỗi hệ thống: ' + err.message, 'error');
      })
      .saveDataToTestSheet(pendingState.subject, [rowData], pendingState.selectedLogIdx);
  }

    }
    
    // Disable các trường khác
    var fieldsToDisable = ['formGroup', 'formProject', 'formVersion', 'formTypeDw', 'formAssignee', 'formReceivedDate', 'formAssigneeDoneDate'];
    fieldsToDisable.forEach(function(fieldId) {
      var field = document.getElementById(fieldId);
      if (field) {
        field.value = '';
        field.disabled = true;
      }
    });
    
    // Enable chỉ 3 trường cần sửa
    if (document.getElementById('formWidth')) {
      document.getElementById('formWidth').value = '';
      document.getElementById('formWidth').disabled = false;
    }
    if (document.getElementById('formHeight')) {
      document.getElementById('formHeight').value = '';
      document.getElementById('formHeight').disabled = false;
    }
    if (document.getElementById('formImageFile')) {
      document.getElementById('formImageFile').value = '';
      document.getElementById('formImageFile').disabled = false;
    }
    if (document.getElementById('formImagePreview')) {
      document.getElementById('formImagePreview').style.display = 'none';
      document.getElementById('formImagePreview').src = '';
    }

    getDrawingModal().show();
  }

  // ========== OPEN BULK EDIT FORM ==========
  function openBulkEditForm() {
    if (bulkState.selectedRows.size === 0) {
      showToast('Vui lòng chọn ít nhất 1 bản vẽ', 'warning');
      return;
    }

    pendingState.selectedLogIdx = 'BULK_' + Array.from(bulkState.selectedRows).join('_');
    pendingState.subject = 'Sửa hàng loạt (' + bulkState.selectedRows.size + ' mục)';
    document.getElementById('modalFormTitle').textContent = 'Sửa Hàng Loạt - ' + bulkState.selectedRows.size + ' Bản Vẽ';

    setToFieldVisibility(false);
    hideSingleEditFields();

    var form = document.getElementById('drawingForm');
    if (!form) return;
    form.reset();

    getDrawingModal().show();
  }

  // Sửa hàm openEditDrawingForm để hiển thị single edit fields
  var originalOpenEditDrawingForm = window.openEditDrawingForm;
  window.openEditDrawingForm = function(rowIdx, subject, customer, to, so) {
    pendingState.selectedLogIdx = rowIdx;
    pendingState.subject = subject;
    document.getElementById('modalFormTitle').textContent = 'Chỉnh Sửa Dữ Liệu Bản Vẽ';

    setToFieldVisibility(true);
    showSingleEditFields();

    var form = document.getElementById('drawingForm');
    if (!form) return;

    form.reset();
    var rDate = document.getElementById('formReceivedDate');
    if (rDate) rDate.value = new Date().toISOString().split('T')[0];
    if (document.getElementById('formCustomer')) document.getElementById('formCustomer').value = customer || '';
    if (document.getElementById('formTO')) document.getElementById('formTO').value = to || '';
    if (document.getElementById('formSO')) document.getElementById('formSO').value = so || '';
    generateDwCode();

    getDrawingModal().show();
  };

  // ========== RENDER DRAWING TABLE VỚI CHECKBOX ==========
  var originalRenderDrawingTable = window.renderDrawingTable;
  window.renderDrawingTable = function(data) {
    pendingState.selectedLogIdx = null;
    bulkState.selectedRows.clear();

    var tbody = document.getElementById('drawingTableBody');
    var emptyState = document.getElementById('emptyTableState');
    if (!tbody || !emptyState) return;

    if (!data || data.length === 0) {
      tbody.innerHTML = '';
      emptyState.classList.remove('d-none');
    } else {
      emptyState.classList.add('d-none');
      var html = data.map(function (item) {
        var type = escHtml(String(item.type || 'New'));
        var to = escHtml(String(item.to || 'N/A'));
        var dwCode = escHtml(String(item.dwCode || 'DW-V2-01V'));
        var customer = escHtml(String(item.customer || 'Unknown'));
        var id = item.rowIdx;
        var subject = escHtml(String(item.subject || '')).replace(/'/g, "\\'");
        var soRaw = String(item.so || '');

        var exists = !!item.existsInData;
        if (!exists && soRaw) {
          var cleanSo = String(soRaw).trim().toUpperCase().replace(/\s+/g, "");
          var digitsSo = cleanSo.replace(/[^0-9]/g, "");
          if (window.pageDataSoSet && window.pageDataSoSet.size > 0) {
            exists = (cleanSo && window.pageDataSoSet.has(cleanSo)) || (digitsSo && window.pageDataSoSet.has(digitsSo));
          } else if (window.pageData && Array.isArray(window.pageData)) {
            exists = window.pageData.some(function (r) {
              if (!Array.isArray(r)) return false;
              var rSo8 = String(r[8] || '').trim().toUpperCase().replace(/\s+/g, "");
              var rSo4 = String(r[4] || '').trim().toUpperCase().replace(/\s+/g, "");
              return (cleanSo && (rSo8.indexOf(cleanSo) !== -1 || rSo4.indexOf(cleanSo) !== -1)) || 
                     (digitsSo && (rSo8.indexOf(digitsSo) !== -1 || rSo4.indexOf(digitsSo) !== -1));
            });
          }
        }

        var actionHtml = '';
        if (exists) {
          var imgUrl = escHtml(String(item.imageUrl || ''));
          var safeSo = escHtml(soRaw).replace(/'/g, "\\'");
          actionHtml = '<button class="btn btn-sm btn-outline-primary fw-bold shadow-sm" onclick="handleSearchPackagingDrawing(\'' + imgUrl + '\', \'' + safeSo + '\')" title="Tìm kiếm bản vẽ đóng gói">' +
            '<i class="fa fa-search me-1"></i>Tìm kiếm</button>';
        } else {
          actionHtml = '<div class="btn-group shadow-sm">' +
            '<button class="btn btn-sm btn-light border text-primary" onclick="openEditDrawingForm(' + id + ', \'' + subject + '\', \'' + customer + '\', \'' + to + '\', \'' + escHtml(soRaw).replace(/'/g, "\\'") + '\')" title="Sửa"><i class="fa fa-pen me-1"></i>Sửa</button>' +
            '<button class="btn btn-sm btn-light border text-danger" onclick="deleteDrawing(' + id + ')" title="Xóa"><i class="fa fa-trash me-1"></i>Xóa</button>' +
            '</div>';
        }

        return '<tr class="bg-white" style="transition: all 0.2s;">' +
          '<td class="ps-4"><div class="form-check"><input class="form-check-input drawing-checkbox" type="checkbox" id="checkbox-' + id + '" data-row-id="' + id + '" onchange="toggleDrawingCheckbox(' + id + ')"></div></td>' +
          '<td class="fw-bold text-dark">' + type + '</td>' +
          '<td><span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle px-2 py-1">' + to + '</span></td>' +
          '<td><code class="text-danger bg-light px-2 py-1 rounded fw-bold border">' + dwCode + '</code></td>' +
          '<td class="text-secondary fw-medium">' + customer + '</td>' +
          '<td class="text-end pe-4">' + actionHtml + '</td>' +
          '</tr>';
      }).join('');
      tbody.innerHTML = html;
    }
  };

  // ========== QUẢN LÍ BẢN VẼ - LOAD & SEARCH ==========
  var managedDrawingList = [];

  function loadManagedDrawings() {
    showLoading('Đang tải bản vẽ đủ dữ liệu...');

    google.script.run
      .withSuccessHandler(function (res) {
        hideLoading();
        if (!res) return showToast('Lỗi phản hồi rỗng', 'error');
        if (res.success) {
          managedDrawingList = res.data || [];
          renderManagedDrawingTable(managedDrawingList);
        } else {
          showToast('Lỗi tải danh sách: ' + res.error, 'error');
        }
      })
      .withFailureHandler(function (err) {
        hideLoading();
        showToast('Lỗi kết nối: ' + err.message, 'error');
      })
      .getManagedDrawings();
  }

  function renderManagedDrawingTable(data) {
    var tbody = document.getElementById('managedDrawingTableBody');
    var emptyState = document.getElementById('emptyManagedState');
    if (!tbody || !emptyState) return;

    if (!data || data.length === 0) {
      tbody.innerHTML = '';
      emptyState.classList.remove('d-none');
    } else {
      emptyState.classList.add('d-none');
      var html = data.map(function (item) {
        // Convert tất cả dữ liệu sang string ngay từ đầu
        var type = escHtml(String(item.type || 'New'));
        var to = escHtml(String(item.to || 'N/A'));
        var dwCode = escHtml(String(item.dwCode || ''));
        var customer = escHtml(String(item.customer || 'Unknown'));
        var cutDrawing = String(item.cutDrawing || '').trim();
        var so = String(item.so || '').trim();
        var id = parseInt(item.rowIdx) || 0;
        var safeCutDrawing = escHtml(cutDrawing).replace(/'/g, "\\'");
        var safeSo = escHtml(so).replace(/'/g, "\\'");

        // Hiển thị ảnh trực tiếp nếu có URL hợp lệ; không cần click vào nút để xem.
        var cutDrawingHtml = '<span class="text-muted">–</span>';
        if (cutDrawing && (cutDrawing.indexOf('http') !== -1 || cutDrawing.indexOf('data:image') !== -1 || cutDrawing.indexOf('drive.google') !== -1)) {
          cutDrawingHtml = '<img src="' + escHtml(cutDrawing) + '" alt="Cut drawing" style="max-width: 84px; max-height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; box-shadow: 0 3px 10px rgba(15,23,42,0.08); display: block; margin: 0 auto;" />';
        } else if (cutDrawing) {
          cutDrawingHtml = '<small class="text-muted">' + escHtml(cutDrawing) + '</small>';
        }

        var actionHtml = '<div class="btn-group shadow-sm">' +
          '<button class="btn btn-sm btn-light border text-primary upgrade-btn" data-item=\'' + JSON.stringify(item).replace(/'/g, "\\'") + '\' title="Nâng cấp bản vẽ"><i class="fa fa-arrow-up-right-dots me-1"></i>Nâng cấp</button>' +
          '<button class="btn btn-sm btn-light border text-danger" onclick="event.stopPropagation(); removeManagedDrawing(' + id + ')" title="Xóa"><i class="fa fa-trash me-1"></i>Xóa</button>' +
          '</div>';

        return '<tr class="bg-white" style="cursor:pointer;" onclick="handleSearchPackagingDrawing(\'' + safeCutDrawing + '\', \'' + safeSo + '\');">' +
          '<td class="ps-4 fw-bold text-dark">' + type + '</td>' +
          '<td><span class="badge bg-success bg-opacity-10 text-success border border-success-subtle px-2 py-1">' + to + '</span></td>' +
          '<td><code class="text-info bg-light px-2 py-1 rounded fw-bold border">' + dwCode + '</code></td>' +
          '<td class="text-secondary fw-medium">' + customer + '</td>' +
          '<td class="text-center">' + cutDrawingHtml + '</td>' +
          '<td class="text-end pe-4">' + actionHtml + '</td>' +
          '</tr>';
      }).join('');
      tbody.innerHTML = html;

      // Event delegation cho nút upgrade
      tbody.querySelectorAll('.upgrade-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          var itemData = JSON.parse(this.dataset.item);
          openUpgradeDrawingForm(itemData);
        });
      });
    }
  }

  function searchManagedDrawingData() {
    var keyword = document.getElementById('searchManagedDrawingInput').value.trim().toLowerCase();
    if (!keyword) {
      renderManagedDrawingTable(managedDrawingList);
      return;
    }

    var filtered = managedDrawingList.filter(function (item) {
      var type = String(item.type || '').toLowerCase();
      var to = String(item.to || '').toLowerCase();
      var dwCode = String(item.dwCode || '').toLowerCase();
      var customer = String(item.customer || '').toLowerCase();
      return type.indexOf(keyword) !== -1 || to.indexOf(keyword) !== -1 || 
             dwCode.indexOf(keyword) !== -1 || customer.indexOf(keyword) !== -1;
    });

    renderManagedDrawingTable(filtered);
  }

  function viewManagedDrawing(rowId) {
    var item = managedDrawingList.find(function (entry) {
      return parseInt(entry.rowIdx) === parseInt(rowId);
    });
    if (item) {
      handleSearchPackagingDrawing(String(item.cutDrawing || ''), String(item.so || ''));
    } else {
      showToast('Không tìm thấy dữ liệu bản vẽ để nâng cấp', 'warning');
    }
  }

  function removeManagedDrawing(rowId) {
    Swal.fire({
      title: 'Xóa khỏi danh sách bản vẽ?',
      text: 'Bản vẽ sẽ được chuyển lại tab "Thêm bản vẽ"',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#ef4444',
      cancelButtonColor: '#94a3b8',
      confirmButtonText: 'Đồng ý xóa',
      cancelButtonText: 'Hủy'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading('Đang xử lý...');
        google.script.run
          .withSuccessHandler(function (res) {
            hideLoading();
            if (res && res.success) {
              showToast('Xóa thành công!', 'success');
              loadManagedDrawings();
            } else {
              showToast('Lỗi: ' + (res ? res.error : 'Không rõ'), 'error');
            }
          })
          .withFailureHandler(function (err) {
            hideLoading();
            showToast('Lỗi kết nối: ' + err.message, 'error');
          })
          .removeManagedDrawing(rowId);
      }
    });
  }

  // ========== ĐIỀU CHỈNH LUỒNG INIT ==========
  window.__dwInfoInitialLoadGuard = window.__dwInfoInitialLoadGuard || {};

  var originalInitThongTinBanVe = window.initThongTinBanVe;
  window.initThongTinBanVe = function() {
    if (typeof originalInitThongTinBanVe === 'function') {
      originalInitThongTinBanVe();
    }

    // Load tab 2 (manual) và tab 3 (manage) ngay từ lúc khởi tạo
    // để tránh loading khi người dùng bấm vào tab
    setTimeout(function() {
      if (!window.__dwInfoInitialLoadGuard.manual) {
        window.__dwInfoInitialLoadGuard.manual = true;
        initNhapDuLieuBanVe();
      }
      if (!window.__dwInfoInitialLoadGuard.manage) {
        window.__dwInfoInitialLoadGuard.manage = true;
        loadManagedDrawings();
      }
    }, 200);
  };

  // Chỉ load 1 lần duy nhất khi tab được bật lần đầu
  document.addEventListener('shown.bs.tab', function (e) {
    var targetId = e && e.target ? e.target.id : '';

    if (targetId === 'manual-tab' && !window.__dwInfoInitialLoadGuard.manual) {
      window.__dwInfoInitialLoadGuard.manual = true;
      initNhapDuLieuBanVe();
      return;
    }

    if (targetId === 'manage-tab' && !window.__dwInfoInitialLoadGuard.manage) {
      window.__dwInfoInitialLoadGuard.manage = true;
      loadManagedDrawings();
    }
  });

  // ========== XỬ LÝ PREVIEW HÌNH ẢNH ==========
  var formImageInput = document.getElementById('formImageFile');
  if (formImageInput) {
    formImageInput.addEventListener('change', function (e) {
      var file = e.target.files[0];
      var preview = document.getElementById('formImagePreview');
      if (file && preview) {
        var reader = new FileReader();
        reader.onload = function (event) {
          preview.src = event.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });
  }

  // ========== SEARCH DRAWING DATA (CẦN UPDATE) ==========
  function searchDrawingData() {
    var keyword = document.getElementById('searchDrawingInput').value.trim().toLowerCase();
    if (!keyword) {
      renderDrawingTable(drawingDataList);
      return;
    }

    var filtered = drawingDataList.filter(function (item) {
      var type = String(item.type || '').toLowerCase();
      var to = String(item.to || '').toLowerCase();
      var dwCode = String(item.dwCode || '').toLowerCase();
      var customer = String(item.customer || '').toLowerCase();
      return type.indexOf(keyword) !== -1 || to.indexOf(keyword) !== -1 || 
             dwCode.indexOf(keyword) !== -1 || customer.indexOf(keyword) !== -1;
    });

    renderDrawingTable(filtered);
  }

</script>
</div>
