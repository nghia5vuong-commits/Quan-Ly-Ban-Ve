<script>
  /* ==========================================================================
     HÀM TIỆN ÍCH
     ========================================================================== */
  function escHtml(str) { return str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }
  function setText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val !== undefined ? val : '–'; }
  
  function showToast(message, type) {
    type = type || 'success';
    var container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div'); container.id = 'toastContainer'; container.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;'; document.body.appendChild(container);
    }
    var bg = type === 'error' ? '#fee2e2' : type === 'warning' ? '#fef9c3' : '#dcfce7', border = type === 'error' ? '#f87171' : type === 'warning' ? '#fde047' : '#4ade80', color = type === 'error' ? '#991b1b' : type === 'warning' ? '#854d0e' : '#166534';
    var icon = type === 'error' ? '<i class="fa fa-circle-xmark me-2"></i>' : type === 'warning' ? '<i class="fa fa-triangle-exclamation me-2"></i>' : '<i class="fa fa-circle-check me-2"></i>';
    var toast = document.createElement('div');
    toast.style.cssText = 'background:' + bg + '; border:1px solid ' + border + '; color:' + color + '; padding:12px 20px; border-radius:8px; font-size:14px; font-weight:600; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1); pointer-events:auto; transition:opacity 0.3s; display:flex; align-items:center;';
    toast.innerHTML = icon + '<span>' + escHtml(message) + '</span>';
    container.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); }, 300); }, 4000);
  }

  /* ==========================================================================
     MODULE 1.1: NHẬN THÔNG TIN MAIL (ÁP DỤNG PROMISE ĐỂ CHẠY SONG SONG)
     ========================================================================== */
  var state = { emails: [], currentPage: 0, totalEmails: 0, hasMore: false, selectedId: null, keyword: '', currentEmailDetail: null };

  function initThongTinBanVe() {
    loadEmailsAndStats(0);
  }

  // 🚀 TỐI ƯU GIAO DIỆN: CHẠY SONG SONG EMAIL + THỐNG KÊ
  async function loadEmailsAndStats(page) {
     loadingRequests++; 
    state.currentPage = page;
    
    try {
      // Bắn 2 luồng xuống máy chủ cùng một lúc bằng Promise.all
      const [emailRes, statsRes] = await Promise.all([
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getManufacturingEmails(page, state.keyword);
        }),
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getStatistics();
        })
      ]);

      hideLoading(); // <--- TẮT LOADING

      // Xử lý kết quả Email
      if (!emailRes || !emailRes.success) {
        showToast('Lỗi tải danh sách: ' + (emailRes ? emailRes.error : 'rỗng'), 'error');
      } else {
        state.emails = emailRes.emails;
        state.totalEmails = emailRes.total;
        state.hasMore = emailRes.hasMore;
        renderEmailList(emailRes.emails);
        renderPagination(emailRes);
      }

      // Xử lý kết quả Thống Kê
      if (statsRes && statsRes.success) {
        setText('statTotal', statsRes.total); 
        setText('statUnread', statsRes.unread);
        setText('statToday', statsRes.today); 
        setText('statWeek', statsRes.thisWeek);
      }
    } catch (err) {
      hideLoading(); // <--- TẮT LOADING NẾU CÓ LỖI
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
    }
  }

  function searchEmails() { 
    var input = document.getElementById('searchInput'); 
    if (input) state.keyword = input.value.trim(); 
    loadEmailsAndStats(0); 
  }

  function changePage(dir) { 
    var newPage = state.currentPage + dir; 
    if (newPage < 0) return; 
    loadEmailsAndStats(newPage); 
  }

  function renderEmailList(emails) {
    var list = document.getElementById('emailList');
    if (!list) return;
    if (!emails || emails.length === 0) {
      list.innerHTML = '<div class="text-center text-muted py-5"><i class="fa fa-inbox fs-4 mb-2"></i><br><small>Không tìm thấy email</small></div>'; return;
    }
    var htmlBuffer = [];
    for (var i = 0; i < emails.length; i++) {
      var email = emails[i];
      var isActive = email.id === state.selectedId ? ' active' : '';
      var isUnread = email.isUnread ? ' unread' : ''; 
      var dot = email.isUnread ? '<span class="position-absolute top-0 start-0 translate-middle p-1 bg-primary border border-light rounded-circle" style="margin-top:20px; margin-left:10px;"></span>' : '';
      
      htmlBuffer.push(
        '<div class="email-item position-relative' + isActive + isUnread + '" onclick="openEmail(\'' + email.id + '\'); return false;">' +
          dot +
          '<div class="d-flex justify-content-between align-items-center mb-1">' +
            '<span class="email-sender text-truncate pe-2" style="font-size:0.9rem;">' + escHtml(email.senderName || email.senderEmail) + '</span>' +
            '<small class="text-muted text-nowrap" style="font-size:0.75rem;">' + escHtml(email.date) + '</small>' +
          '</div>' +
          '<div class="email-subject text-secondary text-truncate" style="font-size:0.85rem;">' + escHtml(email.subject) + '</div>' +
        '</div>'
      );
    }
    list.innerHTML = htmlBuffer.join('');
  }

  function renderPagination(data) {
    var pag = document.getElementById('pagination'); if (!pag) return;
    if (data.total <= 50) { pag.classList.replace('d-flex', 'd-none'); return; }
    pag.classList.replace('d-none', 'd-flex');
    document.getElementById('prevBtn').disabled = state.currentPage === 0;
    document.getElementById('nextBtn').disabled = !data.hasMore;
  }

  // 🚀 TỐI ƯU GIAO DIỆN: KHI CLICK MỞ EMAIL -> TẢI CHI TIẾT & CHECK TRẠNG THÁI TIẾP NHẬN SONG SONG
  async function openEmail(threadId) {
    if (state.selectedId === threadId) return;
    state.selectedId = threadId;
    document.querySelectorAll('#emailList .email-item').forEach(function(el) { 
      el.classList.toggle('active', el.getAttribute('onclick').includes(threadId)); 
    });
    
    showLoading('Đang tải nội dung email...'); // <--- BẬT LOADING

    try {
      // Bắn 2 luồng: Lấy chi tiết nội dung VÀ Lấy trạng thái đã lưu log cùng 1 lúc
      const [detailRes, statusRes] = await Promise.all([
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getEmailDetail(threadId);
        }),
        new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).checkEmailReceived(threadId);
        })
      ]);

      hideLoading(); // <--- TẮT LOADING

      if (!detailRes || !detailRes.success) {
        return showToast('Lỗi tải nội dung: ' + (detailRes ? detailRes.error : 'rỗng'), 'error');
      }

      // Render nội dung trước
      renderEmailDetail(detailRes);

      // Cập nhật huy hiệu "Đã tiếp nhận" từ dữ liệu lấy được ở luồng 2
      var badgeEl = document.getElementById('receivedBadge');
      if (badgeEl && statusRes && statusRes.success && statusRes.isReceived) {
        badgeEl.innerHTML = '<span class="badge bg-success bg-opacity-10 text-success border border-success ms-2 align-middle" style="font-size:0.75rem;"><i class="fa fa-check-circle me-1"></i>Đã tiếp nhận</span>';
      }

      // Render ngầm thống kê để làm mới số lượng "Email Chưa Đọc"
      google.script.run.withSuccessHandler(function(statsData) {
        if (statsData && statsData.success) setText('statUnread', statsData.unread);
      }).getStatistics();

    } catch (err) {
      hideLoading(); // <--- TẮT LOADING NẾU CÓ LỖI
      showToast('Lỗi xử lý email: ' + err.message, 'error');
    }
  }

  function renderEmailDetail(data) {
    state.currentEmailDetail = data;
    var firstMsg = data.messages[0];
    var subject = data.subject || '(Không có tiêu đề)';
    
    var headerHtml = 
      '<div class="d-flex justify-content-between align-items-start">' +
        '<h4 class="fw-bold text-dark mb-0 me-3 lh-base">' + escHtml(subject) + ' <span id="receivedBadge"></span></h4>' +
        '<button class="btn btn-primary shadow-sm text-nowrap" onclick="handleTiepNhanThietKe()">' +
          '<i class="fa fa-file-signature me-2"></i>Tiếp nhận thiết kế' +
        '</button>' +
      '</div>' +
      '<div class="d-flex align-items-center mt-4">' +
        '<div class="bg-primary bg-gradient text-white rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm" style="width:45px;height:45px;font-size:20px;font-weight:bold;">' + 
          (firstMsg.senderName[0] || '?').toUpperCase() + 
        '</div>' +
        '<div>' +
          '<div class="fw-bold text-dark fs-6">' + escHtml(firstMsg.senderName) + ' <span class="text-muted fw-normal" style="font-size:0.85rem;">&lt;' + escHtml(firstMsg.senderEmail) + '&gt;</span></div>' +
          '<small class="text-muted"><i class="fa fa-calendar-alt me-1"></i> ' + escHtml(firstMsg.date) + '</small>' +
        '</div>' +
      '</div>';

    document.getElementById('detailHeader').innerHTML = headerHtml;

    var bodyHtml = data.messages.map(function(msg, idx) {
      return '<div class="card mb-4 border-0 shadow-sm rounded-4 overflow-hidden">' +
             '<div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between">' +
               '<span class="fw-bold text-secondary"><i class="fa fa-reply fa-rotate-180 me-2 text-primary"></i>' + escHtml(msg.senderName) + '</span>' +
               '<small class="text-muted">' + escHtml(msg.date) + '</small>' +
             '</div>' +
             '<div class="card-body pt-2 text-dark" style="font-size:14px;white-space:pre-wrap;line-height:1.6;">' + escHtml(msg.plainBody || '') + '</div>' +
             '</div>';
    }).join('');
    
    document.getElementById('detailBody').innerHTML = bodyHtml;
    document.getElementById('emptyState').classList.replace('d-flex', 'd-none');
    document.getElementById('detailContent').classList.replace('d-none', 'd-flex');
  }

  function handleTiepNhanThietKe() {
    var data = state.currentEmailDetail;
    if (!data) return showToast('Vui lòng chọn email!', 'error');

    var msgIndex = -1, attIndex = -1;
    for (var i = 0; i < data.messages.length; i++) {
      if (data.messages[i].attachments) {
        for (var j = 0; j < data.messages[i].attachments.length; j++) {
          if (data.messages[i].attachments[j].isSheet) { msgIndex = i; attIndex = j; break; }
        }
      }
      if (msgIndex !== -1) break;
    }

    showLoading('Đang bóc tách file Excel và lưu vào tab Log...'); // <--- BẬT LOADING

    if (msgIndex !== -1 && attIndex !== -1) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res) return hideLoading();
          if (!res.success || !res.dataBase64) { hideLoading(); return showToast('Lỗi đọc file đính kèm', 'error'); }
          try {
            var workbook = XLSX.read(res.dataBase64, { type: 'base64', cellDates: true });
            var sheet = workbook.Sheets[workbook.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
            var headerRowIdx = -1, colSO = -1, colCustomer = -1, colMaterial = -1;
            for (var r = 0; r < rows.length; r++) {
              if (!rows[r]) continue;
              for (var c = 0; c < rows[r].length; c++) {
                var val = String(rows[r][c] || '').trim().toLowerCase();
                if (val === 'sales document') { headerRowIdx = r; colSO = c; }
                if (val === 'item descr.') { headerRowIdx = r; colCustomer = c; }
                if (val === 'material') { colMaterial = c; }
              }
              if (headerRowIdx !== -1) break;
            }
            var parsedData = { so: '', customer: '', to: '' };
            if (headerRowIdx !== -1 && rows.length > headerRowIdx + 1) {
              var dataRow = rows[headerRowIdx + 1];
              if (colSO !== -1 && dataRow[colSO]) parsedData.so = 'SO' + String(dataRow[colSO]).replace(/[^0-9]/g, '');
              if (colCustomer !== -1 && dataRow[colCustomer]) parsedData.customer = String(dataRow[colCustomer]).trim().toUpperCase();
              if (colMaterial !== -1 && dataRow[colMaterial]) {
                var rawMat = String(dataRow[colMaterial]).trim();
                parsedData.to = rawMat.length > 1 ? rawMat.substring(1) : rawMat;
              }
            }
            google.script.run.withSuccessHandler(function(sRes) {
              hideLoading(); // <--- TẮT LOADING
              if (!sRes) return;
              if (sRes.success) { 
                showToast('Tiếp nhận dữ liệu thành công!', 'success'); 
                document.getElementById('receivedBadge').innerHTML = '<span class="badge bg-success bg-opacity-10 text-success border border-success ms-2 align-middle" style="font-size:0.75rem;"><i class="fa fa-check-circle me-1"></i>Đã tiếp nhận</span>'; 
              }
              else showToast('Lỗi: ' + sRes.error, 'error');
            }).saveToLogSheet(data.threadId, data.subject, parsedData, JSON.stringify(rows));
          } catch (e) { hideLoading(); showToast('Lỗi parse file Excel', 'error'); } // <--- TẮT LOADING NẾU LỖI PARSE
        }).getAttachmentParsedData(data.threadId, msgIndex, attIndex);
    } else {
      google.script.run.withSuccessHandler(function(sRes) {
        hideLoading(); // <--- TẮT LOADING
        if (!sRes) return;
        if (sRes.success) {
            showToast('Đã tiếp nhận thành công (Không có file Excel)!', 'success');
            document.getElementById('receivedBadge').innerHTML = '<span class="badge bg-success bg-opacity-10 text-success border border-success ms-2 align-middle" style="font-size:0.75rem;"><i class="fa fa-check-circle me-1"></i>Đã tiếp nhận</span>';
        }
        else showToast('Lỗi: ' + sRes.error, 'error');
      }).saveToLogSheet(data.threadId, data.subject, {}, '');
    }
  }

  /* ==========================================================================
     MODULE 1.2: NHẬP DỮ LIỆU BẢN VẼ
     ========================================================================== */
  var pendingState = { selectedLogIdx: null, subject: '' };

  async function initNhapDuLieuBanVe() {
     loadingRequests++; 
    closeDrawingForm();
    try {
      const res = await new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getPendingLogData();
      });
      
      hideLoading(); // <--- TẮT LOADING
      if (!res) return showToast('Lỗi phản hồi rỗng', 'error');
      if (res.success) renderPendingList(res.data);
      else showToast('Lỗi tải danh sách: ' + res.error, 'error');
    } catch (err) {
      hideLoading(); // <--- TẮT LOADING NẾU CÓ LỖI
      showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
    }
  }

  function renderPendingList(logs) {
    var list = document.getElementById('pendingLogList');
    var emptyState = document.getElementById('emptyLogState');
    if (!list || !emptyState) return;

    if (!logs || logs.length === 0) {
      list.innerHTML = ''; list.classList.add('d-none'); emptyState.classList.remove('d-none');
    } else {
      list.classList.remove('d-none'); emptyState.classList.add('d-none');
      
      var html = logs.map(function(log) {
        return '<div class="card hover-card mb-3 border-0 rounded-4 overflow-hidden">' +
          '<div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 bg-white">' +
            '<div>' +
              '<h6 class="fw-bold mb-2 text-dark fs-5">' + escHtml(log.subject) + '</h6>' +
              '<div class="text-muted small d-flex flex-wrap gap-3">' +
                '<span class="bg-light px-2 py-1 rounded"><i class="fa fa-clock me-1 text-primary"></i> ' + escHtml(log.date) + '</span>' +
                '<span class="bg-light px-2 py-1 rounded"><i class="fa fa-building me-1 text-primary"></i> ' + escHtml(log.customer || 'N/A') + '</span>' +
              '</div>' +
            '</div>' +
            '<button id="btn-toggle-' + log.rowIdx + '" class="btn btn-outline-primary fw-bold text-nowrap rounded-pill px-4 shadow-sm" onclick="toggleDrawingForm(' + log.rowIdx + ', \'' + escHtml(log.subject).replace(/'/g, "\\'") + '\', \'' + escHtml(log.customer).replace(/'/g, "\\'") + '\', \'' + escHtml(log.to).replace(/'/g, "\\'") + '\', \'' + escHtml(log.so).replace(/'/g, "\\'") + '\')">' +
              '<i class="fa fa-pen me-2"></i>Nhập dữ liệu' +
            '</button>' +
          '</div>' +
          '<div id="form-container-' + log.rowIdx + '" class="d-none bg-light border-top p-0 rounded-bottom"></div>' +
        '</div>';
      }).join('');
      list.innerHTML = html;
    }
  }

  function toggleDrawingForm(rowIdx, subject, customer, to, so) {
    var container = document.getElementById('form-container-' + rowIdx);
    var form = document.getElementById('drawingForm');
    var btn = document.getElementById('btn-toggle-' + rowIdx);

    if (pendingState.selectedLogIdx === rowIdx && !container.classList.contains('d-none')) {
      closeDrawingForm(); return;
    }

    if (pendingState.selectedLogIdx) {
      var oldBtn = document.getElementById('btn-toggle-' + pendingState.selectedLogIdx);
      if (oldBtn) {
        oldBtn.innerHTML = '<i class="fa fa-pen me-2"></i>Nhập dữ liệu';
        oldBtn.classList.replace('btn-primary', 'btn-outline-primary');
        oldBtn.classList.remove('text-white');
      }
      var oldContainer = document.getElementById('form-container-' + pendingState.selectedLogIdx);
      if (oldContainer) oldContainer.classList.add('d-none');
    }

    pendingState.selectedLogIdx = rowIdx;
    pendingState.subject = subject;

    form.reset();
    var rDate = document.getElementById('formReceivedDate');
    if (rDate) rDate.value = new Date().toISOString().split('T')[0];
    if (document.getElementById('formCustomer')) document.getElementById('formCustomer').value = customer || '';
    if (document.getElementById('formTO')) document.getElementById('formTO').value = to || '';
    if (document.getElementById('formSO')) document.getElementById('formSO').value = so || '';
    
    generateDwCode();
    
    container.appendChild(form);
    container.classList.remove('d-none');
    
    btn.innerHTML = '<i class="fa fa-chevron-up me-2"></i>Đóng form';
    btn.classList.replace('btn-outline-primary', 'btn-primary');
    btn.classList.add('text-white');
  }

  function closeDrawingForm() {
    if (!pendingState.selectedLogIdx) return;
    var container = document.getElementById('form-container-' + pendingState.selectedLogIdx);
    var templateWrapper = document.getElementById('formTemplateWrapper');
    var form = document.getElementById('drawingForm');
    var btn = document.getElementById('btn-toggle-' + pendingState.selectedLogIdx);
    
    if (container) container.classList.add('d-none');
    if (btn) {
      btn.innerHTML = '<i class="fa fa-pen me-2"></i>Nhập dữ liệu';
      btn.classList.replace('btn-primary', 'btn-outline-primary');
      btn.classList.remove('text-white');
    }
    if (templateWrapper && form) templateWrapper.appendChild(form);
    
    pendingState.selectedLogIdx = null;
  }

  function calculateFYE() {
    var actualDate = document.getElementById('formActualDoneDate');
    var fye = document.getElementById('formFYE');
    if (actualDate && fye) fye.value = actualDate.value ? 'FY' + String(new Date(actualDate.value).getFullYear()).substring(2) : '';
  }

  function generateDwCode() {
    var typeDw = document.getElementById('formTypeDw');
    var dwCode = document.getElementById('formDwCode');
    var tValue = typeDw ? typeDw.value : 'V2';
    if (dwCode) dwCode.value = 'DW-' + tValue + '-01V';
  }
  document.addEventListener('change', function(e) { if (e.target && e.target.id === 'formTypeDw') generateDwCode(); });

  function handleDrawingFormSubmit(e) {
    e.preventDefault();
    var rowData = [
      document.getElementById('formGroup').value, document.getElementById('formType').value, document.getElementById('formCustomer').value,
      document.getElementById('formTO').value, document.getElementById('formProject').value, document.getElementById('formSO').value,
      document.getElementById('formDwCode').value, document.getElementById('formVersion').value, document.getElementById('formTypeDw').value,
      document.getElementById('formAssignee').value, document.getElementById('formWidth').value, document.getElementById('formHeight').value,
      document.getElementById('formReceivedDate').value, document.getElementById('formAssigneeDoneDate').value, document.getElementById('formActualDoneDate').value,
      document.getElementById('formFYE').value, document.getElementById('formNote').value
    ];

    var form = document.getElementById('drawingForm');
    var fileInput = form ? form.querySelector('input[type="file"]') : null;
    var file = (fileInput && fileInput.files.length > 0) ? fileInput.files[0] : null;

    showLoading('Đang xử lý dữ liệu và ảnh...'); // <--- BẬT LOADING

    if (file) {
      var reader = new FileReader();
      reader.onload = function(event) {
        var base64String = event.target.result.split(',')[1];
        var imageObj = { base64: base64String, mimeType: file.type, name: file.name };
        rowData.push(imageObj);
        sendDataToGas(rowData);
      };
      reader.onerror = function() {
        hideLoading(); // <--- TẮT LOADING NẾU LỖI ĐỌC FILE
        showToast('Không thể đọc file hình ảnh', 'error');
      };
      reader.readAsDataURL(file);
    } else {
      rowData.push(null);
      sendDataToGas(rowData);
    }
  }

  function sendDataToGas(rowData) {
    google.script.run
      .withSuccessHandler(function(res) {
        hideLoading(); // <--- TẮT LOADING
        if (!res) return showToast('Lỗi phản hồi rỗng', 'error');
        if (res.success) { 
          showToast('Đã lưu thành công!', 'success'); 
          closeDrawingForm(); 
          initNhapDuLieuBanVe(); 
        }
        else showToast('Lỗi lưu sheet: ' + res.error, 'error');
      })
      .withFailureHandler(function(err) {
        hideLoading(); // <--- TẮT LOADING NẾU CÓ LỖI
        showToast('Lỗi hệ thống: ' + err.message, 'error');
      })
      .saveDataToTestSheet(pendingState.subject, [rowData], pendingState.selectedLogIdx);
  }
</script>
