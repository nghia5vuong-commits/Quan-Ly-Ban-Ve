  <style>
    /* =========================================================
       CSS VARIABLES - BẢNG MÀU CHỦ ĐẠO SAAS
       ========================================================= */
    :root {
      --primary-color: #7CB342; 
      --primary-soft: #f0f7ea; 
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-body: #f4f7f9;
      --sidebar-width: 280px;
      --sidebar-mini-width: 84px; /* Kích thước khi thu gọn */
    }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      background-color: var(--bg-body);
      color: var(--text-main);
    }

    /* Tùy chỉnh thanh cuộn cho toàn bộ trang */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* =========================================================
       SIDEBAR & MENU ITEMS
       ========================================================= */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0; /* QUAN TRỌNG: Giữ cho sidebar không bị bẹp dúm */
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1040;
      background: #ffffff;
      border-right: 1px solid #e2e8f0 !important;
    }

    .brand-icon {
      background: linear-gradient(135deg, #99CC66, #7CB342);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(124, 179, 66, 0.3);
    }

    /* Nút Menu Chính */
    .index-nav-item {
      display: flex !important;
      align-items: center;
      color: var(--text-muted);
      border-radius: 12px !important;
      padding: 12px 0 !important;
      transition: all 0.2s ease;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
    }

    .index-nav-item i {
      min-width: 52px; /* Căn giữa icon khi thanh sidebar thu gọn */
      text-align: center;
      font-size: 1.25rem;
      transition: color 0.2s;
    }

    .index-nav-item:hover {
      background-color: #f8fafc;
      color: var(--text-main);
    }

    /* Hiệu ứng Nút Đang Chọn (Active) */
    .index-nav-item.active {
      background-color: var(--primary-soft) !important;
      color: var(--primary-color) !important;
      font-weight: 600 !important;
    }

    .index-nav-item.active i {
      color: var(--primary-color);
    }

    /* Hiệu ứng xoay mũi tên khi mở Sub-menu */
    .index-nav-item[data-bs-toggle="collapse"] .fa-chevron-down {
      transition: transform 0.3s ease;
    }
    .index-nav-item[data-bs-toggle="collapse"]:not(.collapsed) .fa-chevron-down {
      transform: rotate(180deg);
    }

    /* Menu Con (Sub-menu) */
    .sub-nav-item {
      color: var(--text-muted);
      border-radius: 8px !important;
      transition: all 0.2s;
      padding: 10px 12px !important;
      white-space: nowrap;
    }
    .sub-nav-item:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
      transform: translateX(4px);
    }
    .sub-nav-item.active-sub {
      background-color: var(--primary-soft) !important;
      color: var(--primary-color) !important;
      font-weight: 600;
    }

    /* =========================================================
       HIỆU ỨNG MINI SIDEBAR THÔNG MINH
       ========================================================= */
    @media (min-width: 769px) {
      /* Mặc định thu nhỏ Sidebar */
      .sidebar {
        width: var(--sidebar-mini-width) !important; 
        overflow-x: hidden;
      }
      
      /* Khi trỏ chuột vào thì phình to ra */
      .sidebar:hover {
        width: var(--sidebar-width) !important;
        box-shadow: 10px 0 30px rgba(0,0,0,0.03) !important;
      }

      /* Giấu phần chữ đi khi thu nhỏ */
      .sidebar .nav-text, 
      .sidebar .brand-text {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease;
      }

      /* Hiện phần chữ ra khi phình to */
      .sidebar:hover .nav-text, 
      .sidebar:hover .brand-text {
        opacity: 1;
        visibility: visible;
        transition-delay: 0.1s;
      }

      /* Ẩn Submenu và mũi tên khi Sidebar thu nhỏ */
      .sidebar:not(:hover) .collapse { display: none !important; }
      .sidebar:not(:hover) .fa-chevron-down { display: none; }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        transform: translateX(-100%);
        height: 100vh;
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 30px rgba(0,0,0,0.1);
      }
    }

    /* =========================================================
       TOPBAR TÙY CHỈNH
       ========================================================= */
    .topbar {
      height: 70px;
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e2e8f0 !important;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }

    .btn-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f8fafc;
      color: var(--text-muted);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .btn-icon:hover {
      background: #e2e8f0;
      color: var(--primary-color);
    }
    .notify-dot {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    /* Profile Avatar */
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary-color);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(124, 179, 66, 0.2);
    }

    /* =========================================================
       PAGE VIEWS & LOADING
       ========================================================= */
    .index-page-view {
      display: none;
      animation: fadeInUp 0.4s ease-out;
    }
    .index-page-view.active {
      display: block;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>

<script>
  // =========================================================
  // LOGIC ĐIỀU HƯỚNG & LOADING CHÍNH
  // =========================================================
  let loadingRequests = 0;
  let failsafeTimer = null;
  let pageData = [];

  //charger:x=790,y=465,w40
  //checker1:x=735,y=465,w30
  //checker2:x=715,y=480,w30
  //approver:x=640,y=465,w40
  let sign = {
    chager : [790,465,40],
    checker1 : [735,465,40],
    checker2 : [715,480,40],
    approver : [640,465,40]

  }

  function showFirstLoading(text) {
        var el = document.getElementById('mainLoadingText');
    if (el && text) el.textContent = text; 
    
    var overlay = document.getElementById('mainLoadingOverlay');
    if (overlay) {
      overlay.classList.remove('d-none');
      overlay.classList.add('d-flex');
    }

    clearTimeout(failsafeTimer);
    failsafeTimer = setTimeout(function() { forceHideLoading(); }, 150000); 

  }

  function showLoading(text) {
    loadingRequests++;  
    var el = document.getElementById('mainLoadingText');
    if (el && text) el.textContent = text; 
    
    var overlay = document.getElementById('mainLoadingOverlay');
    if (overlay) {
      overlay.classList.remove('d-none');
      overlay.classList.add('d-flex');
    }

    clearTimeout(failsafeTimer);
    failsafeTimer = setTimeout(function() { forceHideLoading(); }, 150000); 
  }

  function hideLoading() {
    loadingRequests--; 
    if (loadingRequests <= 0) forceHideLoading();
  }

  function forceHideLoading() {
    loadingRequests = 0; 
    clearTimeout(failsafeTimer);
    var overlay = document.getElementById('mainLoadingOverlay');
    if (overlay) {
      overlay.classList.remove('d-flex');
      overlay.classList.add('d-none');
    }
  }

  // Bật/tắt Sidebar Mobile
  function toggleMainSidebar() {
    var sidebar = document.getElementById('mainSidebar');
    if (sidebar) sidebar.classList.toggle('open');
  }

  // Chuyển Trang (Views)
  function switchTab(pageName, element) {
    forceHideLoading(); 

    const activeEditModals = document.querySelectorAll('[id^="edit-wrapper-"]');
    activeEditModals.forEach(m => m.remove());
    
    var pages = document.querySelectorAll('.index-page-view');
    pages.forEach(p => p.classList.remove('active'));

    var targetPage = document.getElementById('index-page-' + pageName);
    if(targetPage) targetPage.classList.add('active');

    // Đặt Active Menu Cha
    var items = document.querySelectorAll('.index-nav-item');
    items.forEach(i => i.classList.remove('active'));
    if(element) element.classList.add('active');

    // Nếu không phải là click vào menu con, hãy xóa active của menu con đi
    if(pageName !== 'dwInformation') {
      document.querySelectorAll('.sub-nav-item').forEach(el => {
        el.classList.remove('active-sub');
        el.classList.remove('text-primary', 'bg-light', 'fw-bold');
        el.classList.add('text-secondary');
      });
      // Thu gọn menu con nếu bấm ra trang khác
      var bsCollapse = new bootstrap.Collapse(document.getElementById('dwInfoCollapse'), { toggle: false });
      bsCollapse.hide();
    }

    window.scrollTo(0, 0);

    // Dành cho Mobile: Đóng sidebar sau khi chọn menu
    if (window.innerWidth <= 768) {
       toggleMainSidebar();
    }
  }

  // HÀM XỬ LÝ KHI BẤM VÀO MENU CON CỦA "THÔNG TIN BẢN VẼ"
  function openDwSubTab(tabType, element) {
    // 1. Chuyển sang trang cha (Thông tin bản vẽ)
    var parentBtn = document.getElementById('nav-btn-dwInformation');
    switchTab('dwInformation', parentBtn);

    // Mở khóa menu xổ xuống nếu đang bị đóng (Xử lý lúc thu gọn)
    var dwCollapse = document.getElementById('dwInfoCollapse');
    if(!dwCollapse.classList.contains('show')) {
      new bootstrap.Collapse(dwCollapse).show();
    }

    // 2. Đổi màu nút Sub-menu
    document.querySelectorAll('.sub-nav-item').forEach(el => {
      el.classList.remove('active-sub', 'text-primary', 'bg-light', 'fw-bold');
      el.classList.add('text-secondary');
    });
    element.classList.remove('text-secondary');
    element.classList.add('active-sub', 'text-primary', 'bg-light', 'fw-bold');

    // 3. Kích hoạt Bootstrap Tab ngầm ở trang con
    var tabId = (tabType === 'mail') ? '#mail-tab' : '#manual-tab';
    var triggerEl = document.querySelector(tabId);
    if (triggerEl) {
      var tab = new bootstrap.Tab(triggerEl);
      tab.show();
    }

    // 4. Bắt đầu tải dữ liệu tương ứng
    if (tabType === 'mail') {
      if(typeof initThongTinBanVe === 'function') initThongTinBanVe();
    } else {
      if(typeof initNhapDuLieuBanVe === 'function') initNhapDuLieuBanVe();
    }
  }

  // Khởi tạo hệ thống
  document.addEventListener('DOMContentLoaded', function() {
    showFirstLoading(); // Bật loading che toàn màn hình

    // Đổi ngôn ngữ
    const savedLang = localStorage.getItem('app_lang') || 'vi';
    if(typeof changeLanguage === 'function') changeLanguage(savedLang);

    // Xử lý Tab mặc định
    var pageToLoad = "<?= initialPage ?>"; 
    if (!pageToLoad || !document.getElementById('index-page-' + pageToLoad)) {
        pageToLoad = "dwDesign"; 
    }
    var navButton = document.getElementById('nav-btn-' + pageToLoad);
    if(navButton) switchTab(pageToLoad, navButton);

    // 2. GỌI API VÀ BẮT BUỘC ĐỢI CÓ DATA MỚI RENDER
    google.script.run
        .withSuccessHandler(function(statsData) {
            // Nhận dữ liệu từ server
            pageData = statsData; 
            // console.log("Dữ liệu pageData đã tải xong:", pageData);


            // 3. CHỈ KHỞI TẠO CÁC BẢNG SAU KHI ĐÃ CÓ PAGEDATA
            if(typeof initThongTinBanVe === 'function') initThongTinBanVe();
            if(typeof initNhapDuLieuBanVe === 'function') initNhapDuLieuBanVe();
            
            if(typeof initThietKeBanVe === 'function')initThietKeBanVe();
            

            if(pageToLoad === "submitDrawingsForApproval" && typeof initSubmitApproval === 'function'){
                initSubmitApproval();
            }

            // 4. MỌI THỨ VẼ XONG XUÔI MỚI TẮT LOADING
            forceHideLoading(); 
        })
        .withFailureHandler(function(err) {
            alert("Lỗi tải dữ liệu: " + err.message);
            forceHideLoading();
        })
        .getAllData();
});

      function changeLanguage(langCode) {
          localStorage.setItem('app_lang', langCode);

          // document.getElementById('current-lang-display').innerText = translations[langCode]['lang_name'];

          const elements = document.querySelectorAll('[data-i18n]');
          elements.forEach(el => {
              const key = el.getAttribute('data-i18n');
              if (translations[langCode][key]) {
                  el.innerText = translations[langCode][key];
              }
          });
      }
