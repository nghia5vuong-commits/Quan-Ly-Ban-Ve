      <textarea id="rejectReasonInput"
        data-i18n-placeholder="approval_reject_placeholder" placeholder="Nhập lý do chi tiết (sai kích thước, sai thông số, chưa đạt chuẩn...)" rows="4"
        style="width:100%; padding:12px 14px; border:1.5px solid #cbd5e1; border-radius:10px; font-size:0.88rem; resize:vertical; outline:none; font-family:inherit; box-sizing:border-box; transition:border-color .2s;"
        onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#cbd5e1'"></textarea>
      <div id="rejectReasonError" style="color:#ef4444; font-size:0.8rem; margin-top:6px; display:none;">
        <i class="bi bi-exclamation-circle me-1"></i><span data-i18n="approval_reject_required">Vui lòng nhập lý do từ chối!</span>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px; justify-content:flex-end;">
        <button type="button" onclick="closeRejectModal()"
          style="padding:8px 20px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; color:#64748b; font-weight:600; font-size:0.85rem; cursor:pointer;">
          <span data-i18n="approval_cancel">Hủy</span>
        </button>
        <button type="button" id="btnConfirmReject" onclick="submitReject()"
          style="padding:8px 22px; border-radius:8px; border:none; background:#ef4444; color:#ffffff; font-weight:700; font-size:0.85rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 8px rgba(239,68,68,0.3);">
          <i class="bi bi-x-circle-fill"></i> <span data-i18n="approval_confirm_reject">Xác Nhận Từ Chối</span>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ============================================================
     JAVASCRIPT XỬ LÝ DỮ LIỆU & TƯƠNG TÁC GIAO DIỆN PHÊ DUYỆT
     ============================================================ -->
<script>
  let currentApprovalTab = 'ALL';
  let approvalRowsData = [];
  let approvalRenderScheduled = false;
  let approvalInitInFlight = false;

  function scheduleApprovalRender() {
    if (approvalRenderScheduled) return;
    approvalRenderScheduled = true;
    requestAnimationFrame(function () {
      approvalRenderScheduled = false;
      renderApprovalTable();
    });
  }

  document.querySelector('.page-submitDrawingsForApproval').addEventListener('click', function (event) {
    var tabButton = event.target.closest('[data-approval-tab]');
    if (tabButton) {
      switchApprovalTab(tabButton.dataset.approvalTab);
      return;
    }

    var refreshButton = event.target.closest('[data-refresh-approval]');
    if (refreshButton) {
      initSubmitApproval();
      return;
    }

    var bulkApproveButton = event.target.closest('[data-bulk-approve]');
    if (bulkApproveButton) {
      openBulkApproveForm();
      return;
    }

    var bulkReleaseButton = event.target.closest('[data-bulk-release]');
    if (bulkReleaseButton) {
      openBulkReleaseForm();
    }
  });

  function cleanStr(s) {
    if (!s) return '';
    return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  const COL_MAP = {
    ID: 0,            // Cột A: ID
    GROUP: 3,         // Cột D: Group
    TYPE: 4,          // Cột E: Type
    REQ_NO: 8,        // Cột I: Request No / TO
    PROJECT: 9,       // Cột J: Dự án
    CUSTOMER: 10,     // Cột K: Khách hàng
    DW_NO: 11,        // Cột L: Mã bản vẽ
    DRAWING_REVISE: 5, // Cột F: Drawing Revise
    VERSION: 12,      // Cột M: Version Drawing
    STATUS: 2,        // Cột C: Trạng thái
    PDF_LINK_O: 14,   // Cột O (15): File Drawing (PDF)
    PDF_LINK_AF: 31,  // Cột AF (32): File Stamped PDF
    CHECKER_BY: 17,   // Cột R: Người ký Checker
    CHECKER_DATE: 18, // Cột S: Ngày ký Checker
    APPROVAL_BY: 19,  // Cột T: Người ký Approval
    APPROVAL_DATE: 20 // Cột U: Ngày ký Approval
  };

  function getLevelStates(status) {
    const st = cleanStr(status);
    // Pipeline: Checker xác nhận -> Checker 1 ký -> Checker 2 ký -> Approval ký.
    if (st.includes('cho checker') && !st.includes('cho checker 1') && !st.includes('cho checker 2')) return ['waiting', 'pending', 'pending', 'pending'];
    if (st.includes('cho duyet') || st.includes('cho checker 1') || st.includes('checker1')) return ['done', 'waiting', 'pending', 'pending'];
    if (st.includes('cho checker 2') || st.includes('checker 2')) return ['done', 'done', 'waiting', 'pending'];
    if (st.includes('cho approval') || st.includes('approval') || st.includes('duyet') || st.includes('trinh ky')) return ['done', 'done', 'done', 'waiting'];
    if (st.includes('cho ban hanh') || st.includes('ban hanh') || st.includes('dang ban hanh')) return ['done', 'done', 'done', 'done'];
    if (st.includes('hoan thanh') || st.includes('done') || st.includes('released')) return ['done', 'done', 'done', 'done'];
    return ['waiting', 'pending', 'pending', 'pending'];
  }

  function stateLabel(s) {
    if (s === 'done') return '<span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1 fw-bold"><i class="bi bi-check-circle-fill me-1"></i>Đã ký</span>';
    if (s === 'waiting') return '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-1 fw-bold"><i class="bi bi-hourglass-split me-1"></i>Đang chờ ký</span>';
    return '<span class="badge bg-light text-muted border px-3 py-1">Chưa tới lượt</span>';
  }

  function normalizeApprovalLevelName(value) {
    if (!value && value !== 0) return '';
    const clean = String(value)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]/g, '')
      .trim();
    if (clean === 'leader' || clean === 'kiemtra1' || clean === 'check1') return 'checker1';
    if (clean === 'checker' || clean === 'kiemtraso') return 'checker';
    if (clean === 'mgr' || clean === 'manager' || clean === 'kiemtra2' || clean === 'check2') return 'checker2';
    if (clean === 'gm' || clean === 'gmqa' || clean === 'pheduyet') return 'approval';
    if (clean === 'st' || clean === 'soanthao' || clean === 'chager' || clean === 'charge') return 'charger';
    return clean;
  }

  function isReleaseEligibleRow(row) {
    if (!row) return false;
    const status = String(row[COL_MAP.STATUS] || '');
    const st = cleanStr(status);
    return st === 'cho ban hanh';
  }

  function isApproveEligibleRow(row) {
    if (!row) return false;
    const currentPosition = normalizeApprovalLevelName((typeof user !== 'undefined' && user && user.position) ? user.position : '');
    const [checker, c1, c2, c3] = getLevelStates(String(row[COL_MAP.STATUS] || ''));
    if (currentPosition === 'checker') {
      return checker === 'waiting';
    }
    if (currentPosition.includes('checker1') || currentPosition.includes('c1')) {
      return c1 === 'waiting';
    }
    if (currentPosition.includes('checker2') || currentPosition.includes('c2')) {
      return c2 === 'waiting';
    }
    if (currentPosition.includes('approval') || currentPosition.includes('approver') || currentPosition.includes('gmqa')) {
      return c3 === 'waiting';
    }
    return c1 === 'waiting' || c2 === 'waiting' || c3 === 'waiting';
  }

  function canUserApproveLevel(levelName) {
    const currentPosition = normalizeApprovalLevelName((typeof user !== 'undefined' && user && user.position) ? user.position : '');
    if (!currentPosition) return false;

    const target = normalizeApprovalLevelName(levelName || '');
    if (!target) return false;

    const allowedMap = {
      checker: ['checker'],
      checker1: ['checker1', 'c1'],
      checker2: ['checker2', 'c2'],
      approval: ['approval', 'approver', 'gmqa', 'qa', 'gmqa'],
      approver: ['approval', 'approver', 'gmqa', 'qa', 'gmqa'],
      charger: ['charger', 'chager']
    };

    const allowed = allowedMap[currentPosition] || [];
    return allowed.includes(target) || currentPosition === target;
  }

  function isChargeUserBulkApproveBlocked() {
    const currentPosition = normalizeApprovalLevelName((typeof user !== 'undefined' && user && user.position) ? user.position : '');
    return currentPosition.includes('charg') || currentPosition.includes('chager');
  }

  let approvalCurrentPage = 1;
  const approvalPageSize = 25;
  var approvalSearchDebounce = null;

  function onSearchApprovalInput() {
    if (typeof window.appDebounce === 'function') {
      if (!approvalSearchDebounce) {
        approvalSearchDebounce = window.appDebounce(function () {
          approvalCurrentPage = 1;
          scheduleApprovalRender();
        }, 250);
      }
      approvalSearchDebounce();
    } else {
      approvalCurrentPage = 1;
      scheduleApprovalRender();
    }
  }

  function changeApprovalPage(delta) {
    approvalCurrentPage += delta;
    scheduleApprovalRender();
  }

  function updateApprovalPaginationUI(total, start, end, page, totalPages) {
    const infoEl = document.getElementById('approvalPaginationInfo');
    const indicatorEl = document.getElementById('approvalPageIndicator');
    const prevBtn = document.getElementById('approvalPrevBtn');
    const nextBtn = document.getElementById('approvalNextBtn');
    const toolbar = document.getElementById('approvalPaginationToolbar');

    if (!toolbar) return;
    if (total === 0) {
      toolbar.classList.add('d-none');
      return;
    }
    toolbar.classList.remove('d-none');
    if (infoEl) infoEl.textContent = `Hiển thị ${start + 1} - ${Math.min(end, total)} / Tổng số ${total} bản vẽ`;
    if (indicatorEl) indicatorEl.textContent = `${page} / ${totalPages}`;
    if (prevBtn) prevBtn.disabled = page <= 1;
    if (nextBtn) nextBtn.disabled = page >= totalPages;
  }

  function switchApprovalTab(tabName) {
    currentApprovalTab = tabName;
    approvalCurrentPage = 1;
    const tabs = ['ALL', 'BARSALE', 'OEM', 'WE SASH'];
    tabs.forEach(t => {
      let btnId = 'tab-approval-' + (t === 'WE SASH' ? 'we' : t.toLowerCase());
      let el = document.getElementById(btnId);
      if (el) el.classList.toggle('active', t === tabName);
    });
    scheduleApprovalRender();
  }

  function initSubmitApproval() {
    if (approvalInitInFlight) return;
    approvalInitInFlight = true;
    if (window.__recordAppTiming) window.__recordAppTiming('submitApproval.init.start');
    const tbody = document.getElementById('approvalTableBody');
    if (!tbody) {
      approvalInitInFlight = false;
      return;
    }
    approvalCurrentPage = 1;

    const rawData = (Array.isArray(window.pageData) && window.pageData.length > 0)
      ? window.pageData
      : ((typeof pageData !== 'undefined' && Array.isArray(pageData)) ? pageData : []);
    if (!rawData || rawData.length === 0) { 
      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm text-primary me-2"></span> Đang tải dữ liệu trình ký...</td></tr>';
      approvalInitInFlight = false;
      return; 
    }

    let rows = rawData;
    if (rows.length > 0 && String(rows[0][COL_MAP.ID]).toLowerCase().trim() === 'id') {
      rows = rows.slice(1);
    }

    // ========================================================================
    // LỌC DỮ LIỆU THEO POSITION CỦA USER
    // ========================================================================
    const currentPosition = normalizeApprovalLevelName((typeof user !== 'undefined' && user && user.position) ? user.position : '');

    approvalRowsData = rows.filter(row => {
      const id = row[COL_MAP.ID];
      if (!id || String(id).trim() === '') return false;
      
      const statusRaw = String(row[COL_MAP.STATUS] || '');
      const st = cleanStr(statusRaw);
      const pdf = row[COL_MAP.PDF_LINK_AF] || row[COL_MAP.PDF_LINK_O] || '';
      const hasPdf = pdf && String(pdf).includes('http');

      // Charger xem được tất cả (hoặc chager, hoặc không có position)
      if (currentPosition.includes('charg') || !currentPosition) {
        const isTarget = st.includes('cho duyet') || st.includes('cho checker') || st.includes('cho approval')
          || st.includes('cho ban hanh') || st.includes('ban hanh') || st.includes('dang ban hanh')
          || st.includes('checker') || st.includes('approval') || st.includes('duyet') || st.includes('trinh ky')
          || st.includes('checking') || st.includes('pending');
        return isTarget || (hasPdf && !st.includes('hoan thanh') && !st.includes('done') && !st.includes('released'));
      }

      // Checker: chỉ xem bản vẽ đang chờ xác nhận trước.
      if (currentPosition === 'checker') {
        return st.includes('cho checker') && !st.includes('cho checker 1') && !st.includes('cho checker 2');
      }

      // Checker 1: Xem bản vẽ chờ Checker 1 và bản vẽ đã chuyển sang Checker 2 (để coi lại PDF đã ký)
      if (currentPosition.includes('checker1') || currentPosition.includes('c1')) {
        const isChecker1Waiting = st.includes('cho duyet') || st.includes('cho checker 1') || st.includes('checker1');
        const isChecker2Waiting = st.includes('cho checker 2') || st.includes('checker 2') || st.includes('checker2');
        return isChecker1Waiting || isChecker2Waiting;
      }

      // Checker 2: Xem bản vẽ chờ Checker 2 và bản vẽ đã chuyển sang Approval (để coi lại PDF đã ký)
      if (currentPosition.includes('checker2') || currentPosition.includes('c2')) {
        const isChecker2Waiting = st.includes('cho checker 2') || st.includes('checker 2') || st.includes('checker2');
        const isApprovalWaiting = st.includes('cho approval') || st.includes('approval') || st.includes('gmqa') || st.includes('trinh ky');
        return isChecker2Waiting || isApprovalWaiting;
      }

      // Approval (GM QA): Xem bản vẽ chờ Approval và bản vẽ Approval đã ký duyệt (Chờ ban hành, Ban hành, Đã ban hành...)
      if (currentPosition.includes('approval') || currentPosition.includes('approver') || currentPosition.includes('gmqa')) {
        const isApprovalWaiting = st.includes('cho approval') || st.includes('approval') || st.includes('gmqa')
          || st.includes('trinh ky');
        const isApprovedByApproval = st.includes('cho ban hanh') || st.includes('ban hanh') || st.includes('dang ban hanh')
          || st.includes('hoan thanh') || st.includes('done') || st.includes('released');
        return isApprovalWaiting || isApprovedByApproval;
      }

      // Mặc định: không hiển thị
      return false;
    });

    if (window.__recordAppTiming) window.__recordAppTiming('submitApproval.init.complete');
    approvalInitInFlight = false;
    scheduleApprovalRender();
  }

  function renderApprovalTable() {
    const tbody = document.getElementById('approvalTableBody');
    if (!tbody) return;

    if (!approvalRowsData || approvalRowsData.length === 0) {
      renderEmptyTable(tbody);
      updateApprovalPaginationUI(0, 0, 0, 1, 1);
      return;
    }

    const keyword = (document.getElementById('searchApprovalInput')?.value || '').toLowerCase().trim();

    let filtered = approvalRowsData.filter(r => {
      const typeVal = (String(r[COL_MAP.GROUP] || '') + " " + String(r[COL_MAP.TYPE] || '')).toUpperCase();
      if (currentApprovalTab === 'BARSALE' && !typeVal.includes('BARSALE')) return false;
      if (currentApprovalTab === 'OEM' && !typeVal.includes('OEM')) return false;
      if (currentApprovalTab === 'WE SASH' && (typeVal.includes('BARSALE') || typeVal.includes('OEM'))) return false;

      if (keyword) {
        const toVal = String(r[COL_MAP.REQ_NO] || '').toLowerCase();
        const dwVal = String(r[COL_MAP.DW_NO] || '').toLowerCase();
        const custVal = String(r[COL_MAP.CUSTOMER] || '').toLowerCase();
        const projVal = String(r[COL_MAP.PROJECT] || '').toLowerCase();
        return toVal.includes(keyword) || dwVal.includes(keyword) || custVal.includes(keyword) || projVal.includes(keyword);
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-5 text-muted"><i class="bi bi-inbox fs-2 d-block mb-2"></i>Không có bản vẽ nào trùng khớp.</td></tr>';
      updateApprovalPaginationUI(0, 0, 0, 1, 1);
      return;
    }

    // Phân trang
    const totalItems = filtered.length;
    const totalPages = Math.ceil(totalItems / approvalPageSize) || 1;
    if (approvalCurrentPage < 1) approvalCurrentPage = 1;
    if (approvalCurrentPage > totalPages) approvalCurrentPage = totalPages;

    const startIdx = (approvalCurrentPage - 1) * approvalPageSize;
    const endIdx = startIdx + approvalPageSize;
    const pageRows = filtered.slice(startIdx, endIdx);

    let html = '';
    pageRows.forEach((row, idx) => {
      html += buildRowHtml(row, startIdx + idx);
    });
    tbody.innerHTML = html;

    updateApprovalPaginationUI(totalItems, startIdx, endIdx, approvalCurrentPage, totalPages);
    updateBulkApproveButtonVisibility();
  }

  // Lưu trữ PDF URL cho mỗi bản vẽ để tránh nhúng URL phức tạp vào onclick HTML
  window._approvalPdfMap = window._approvalPdfMap || {};

  function buildRowHtml(row, idx) {
    const id = String(row[COL_MAP.ID] || '');
    const sourceRowIndex = approvalRowsData.indexOf(row);
    const type = row[COL_MAP.TYPE] || row[COL_MAP.GROUP] || '—';
    const reqNo = row[COL_MAP.REQ_NO] || '—';
    const dwNo = row[COL_MAP.DW_NO] || 'Chưa có mã';
    const version = row[COL_MAP.VERSION] || '0';
    const project = row[COL_MAP.PROJECT] || '—';
    const customer = row[COL_MAP.CUSTOMER] || 'Chưa rõ KH';
    const statusRaw = String(row[COL_MAP.STATUS] || 'Chờ Checker').trim();
    const pdfUrl = String(row[COL_MAP.PDF_LINK_AF] || row[COL_MAP.PDF_LINK_O] || '');
    if (id) window._approvalPdfMap[id] = pdfUrl;

    const [checker, c1, c2, c3] = getLevelStates(statusRaw);
    const hasPdf = pdfUrl.includes('http');
    const st = cleanStr(statusRaw);

    let bb = '#dbeafe', bc = '#1e40af';
    if (st.includes('cho checker 2') || st.includes('checker 2')) { bb = '#ede9fe'; bc = '#6d28d9'; }
    else if (st.includes('cho approval') || st.includes('approval') || st.includes('duyet')) { bb = '#d1fae5'; bc = '#065f46'; }
    else if (st.includes('cho ban hanh') || st.includes('ban hanh') || st.includes('dang ban hanh')) { bb = '#e0f2fe'; bc = '#0369a1'; }
    else if (st.includes('hoan thanh') || st.includes('done') || st.includes('released')) { bb = '#f0fdf4'; bc = '#15803d'; }

    const isReleaseStatus = st === 'cho ban hanh';

    const pdfBtn = hasPdf
      ? `<button class="btn-view-pdf shadow-sm" onclick="event.stopPropagation();viewApprovalPdf('${pdfUrl}')"><i class="bi bi-file-earmark-pdf-fill text-danger"></i> PDF</button>`
      : `<button class="btn-view-pdf" disabled><i class="bi bi-file-earmark-pdf"></i> N/A</button>`;

    const rowActionHtml = isReleaseStatus
      ? `<div class="d-flex gap-1 justify-content-center align-items-center flex-wrap">
          ${pdfBtn}
          <button class="btn-step-approve shadow-sm" data-row-id="${id}" data-dw-no="${dwNo}" onclick="event.stopPropagation(); openBulkReleaseFormForRow('${id}', '${dwNo}')" title="Gửi ban hành lên QA System">
            <i class="fa fa-rocket me-1"></i> Gửi ban hành
          </button>
        </div>`
      : pdfBtn;

    const mkActions = (state, id, dwNo, level, label) => {
      if (state === 'done') return '';
      if (state !== 'waiting') return '';
      if (!canUserApproveLevel(level)) return '';
      return `
        <div class="level-actions">
          <button class="btn-step-approve shadow-sm"
            data-row-id="${id}" data-dw-no="${dwNo}" data-level="${level}"
            onclick="handleApproveById(this)">
            <i class="bi bi-check-circle-fill"></i> ${label}
          </button>
          <button class="btn-step-reject shadow-sm" onclick="openRejectModal('${id}','${dwNo}','${level}')">
            <i class="bi bi-x-circle-fill"></i> Từ chối
          </button>
        </div>`;
    };

    const canActOnRow = isApproveEligibleRow(row) || isReleaseEligibleRow(row);
    const cbDisabled = canActOnRow ? '' : 'disabled';
    const cbTitle = canActOnRow ? '' : 'title="Bản vẽ đã hoàn tất cấp duyệt của bạn hoặc đang chờ cấp tiếp theo"';
    const cbCursor = canActOnRow ? 'cursor: pointer;' : 'cursor: not-allowed; opacity: 0.38;';

    return `
    <tr id="dw-card-${id}" class="dw-row" onclick="toggleRowDetail('${id}')">
      <td class="text-center" onclick="event.stopPropagation();">
        <input type="checkbox" class="form-check-input approval-row-checkbox" data-row-id="${id}" data-row-index="${sourceRowIndex}" onchange="updateBulkApproveButtonVisibility(); updateBulkReleaseButtonVisibility();" ${cbDisabled} ${cbTitle} style="${cbCursor}">
      </td>
      <td class="text-center fw-bold text-secondary">${idx + 1}</td>
      <td><span class="badge bg-light text-dark border px-2 py-1">${type}</span></td>
      <td><span class="fw-semibold text-dark">${reqNo}</span></td>
      <td>
        <span class="fw-bold text-primary">${dwNo}</span>
      </td>
      <td class="text-center">
        <span class="badge bg-secondary-subtle text-secondary border">v${version}</span>
      </td>
      <td>${project}</td>
      <td><span class="chip-cust"><i class="bi bi-building me-1"></i>${customer}</span></td>
      <td class="text-center">
        <span class="status-badge mb-1" style="background:${bb};color:${bc};">${statusRaw}</span>
        <div class="pipeline-dots d-flex justify-content-center mt-1" title="Checker xác nhận  ->  Checker 1  ->  Checker 2  ->  Approval">
          <span class="dot" data-state="${checker}" title="Xác nhận trước - Checker"></span>
          <div class="dot-connector"></div>
          <span class="dot" data-state="${c1}" title="Cấp 1 - Checker 1"></span>
          <div class="dot-connector"></div>
          <span class="dot" data-state="${c2}" title="Cấp 2 - Checker 2"></span>
          <div class="dot-connector"></div>
          <span class="dot" data-state="${c3}" title="Cấp 3 - Approval"></span>
        </div>
      </td>
      <td class="text-center" onclick="event.stopPropagation();">
        ${rowActionHtml}
      </td>
    </tr>
    <tr id="detail-row-${id}" style="display: none;">
      <td colspan="10" class="p-0 border-0">
        <div class="detail-expand-container shadow-inner">
          <div class="level-card-group">
            <div class="card-level ${checker}">
              <div class="card-level-header">
                <div class="level-title"><i class="bi bi-shield-check text-info fs-5"></i> Xác nhận trước — Checker</div>
                ${stateLabel(checker)}
              </div>
              <div class="level-desc">Kiểm tra trước khi chuyển sang Checker 1. Không đóng dấu lên PDF.</div>
              ${mkActions(checker, id, dwNo, 'Checker', 'Xác nhận')}
            </div>

            <div class="card-level ${c1}">
              <div class="card-level-header">
                <div class="level-title"><i class="bi bi-1-circle-fill text-primary fs-5"></i> Duyệt cấp 1 — Checker 1</div>
                ${stateLabel(c1)}
              </div>
              <div class="level-desc">Kiểm tra kỹ thuật lần 1</div>
              ${mkActions(c1, id, dwNo, 'Checker 1', 'Duyệt')}
            </div>

            <div class="card-level ${c2}">
              <div class="card-level-header">

  async function handleApprove(rowId, dwNo, level, passedPdfUrl, triggerBtn) {
    if (_isApprovingSingle) return;

    const targetRow = (approvalRowsData || []).find(r => String(r[COL_MAP.ID] || '') === String(rowId));
    const pdfUrl = (passedPdfUrl && passedPdfUrl.includes('http')) ? passedPdfUrl : (targetRow ? String(targetRow[COL_MAP.PDF_LINK_AF] || targetRow[COL_MAP.PDF_LINK_O] || '') : '');

    const doIt = async () => {
      if (_isApprovingSingle) return;
      _isApprovingSingle = true;

      const originalBtnHtml = triggerBtn ? triggerBtn.innerHTML : '';
      if (triggerBtn) {
        triggerBtn.disabled = true;
        triggerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Đang xử lý...';
      }

      try {
        if (level === 'Checker') {
          showApprovalLoading('Đang xác nhận trước khi chuyển tới Checker 1...');
          await confirmCheckerOnServer(rowId);
          hideApprovalLoading();
          if (typeof Swal !== 'undefined') {
            Swal.fire({
              title: 'Đã xác nhận',
              text: `Bản vẽ ${dwNo} đã được chuyển tới Checker 1.`,
              icon: 'success'
            });
          }
          if (targetRow) targetRow[COL_MAP.STATUS] = 'Chờ Checker 1';
          if (typeof AppDataStore !== 'undefined') AppDataStore.invalidate('mainData');
          scheduleApprovalRender();
          return;
        }

        if (!pdfUrl || !pdfUrl.includes('http')) {
          throw new Error("Bản vẽ này chưa có đường dẫn file PDF đính kèm trên Google Drive để thực hiện đóng dấu chữ ký!");
        }

        showApprovalLoading('BƯỚC 1/3: Đang tải file PDF & con dấu từ Google Drive...');

        const userMail = (typeof user !== 'undefined' && user.mail) ? user.mail : 'System';

        // 1. Lấy Base64 của PDF và Chữ ký từ Google Apps Script
        const fileData = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .getFilesFromDrive(pdfUrl, userMail);
        });

        if (!fileData || !fileData.success || !fileData.pdfBase64 || !fileData.stampBase64) {
          throw new Error(fileData ? (fileData.message || fileData.error) : "Không thể lấy dữ liệu PDF/Con dấu từ Google Drive.");
        }

        showApprovalLoading(`BƯỚC 2/3: Đang thực hiện đóng dấu chữ ký cấp ${level}...`);

        const pdfBlob = await fetch("data:application/pdf;base64," + fileData.pdfBase64).then(res => res.blob());
        const stampBlob = await fetch("data:image/png;base64," + fileData.stampBase64).then(res => res.blob());

        // Gửi cho Python Backend: Chỉ cần truyền file và chức vụ level, Python sẽ tự định vị ô
        const formData = new FormData();
        formData.append("pdf_file", pdfBlob, "document.pdf");
        formData.append("stamp_file", stampBlob, "stamp.png");
        formData.append("level", level);

        const localApiUrl = "http://10.156.42.195:8000/quan-ly-ban-ve/signToPDW";

        const apiResponse = await fetch(localApiUrl, { method: "POST", body: formData });

        if (!apiResponse.ok) {
          throw new Error(`Local API (${localApiUrl}) trả về lỗi HTTP ${apiResponse.status}. Vui lòng kiểm tra lại dịch vụ đóng dấu!`);
        }

        const contentType = String(apiResponse.headers.get('content-type') || '').toLowerCase();
        if (!contentType.includes('application/pdf') && !contentType.includes('application/octet-stream')) {
          const errorText = await apiResponse.text();
          throw new Error(`Local API (${localApiUrl}) không trả đúng file PDF đã ký. ${errorText ? 'Chi tiết: ' + errorText : ''}`);
        }

        const signedPdfBlob = await apiResponse.blob();
        if (!signedPdfBlob || signedPdfBlob.size < 64) {
          throw new Error('Local API trả về PDF đã ký nhưng kích thước file quá nhỏ hoặc rỗng.');
        }

        const base64SignedPdf = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(signedPdfBlob);
        });

        showApprovalLoading("BƯỚC 3/3: Đang lưu bản vẽ đã đóng dấu & hoàn tất phê duyệt...");

        // Gửi Base64 file đã đóng dấu lên server để lưu và nhận lại URL mới
        const signedPdfUrl = await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .submitForApproval(rowId, base64SignedPdf);
        });

        // Cập nhật trạng thái duyệt trên server
        await new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .approveDrawingOnServer(rowId, level);
        });

        hideApprovalLoading();
        if (typeof Swal !== 'undefined') {
          const viewBtn = signedPdfUrl ? `<br><br><a href="${signedPdfUrl}" target="_blank" class="btn btn-primary fw-bold text-white px-3 py-2 shadow-sm"><i class="bi bi-file-earmark-pdf-fill me-1"></i> Xem ngay bản vẽ PDF vừa ký</a>` : '';
          Swal.fire({
            title: 'Ký duyệt thành công!',
            html: `Bản vẽ <b>${dwNo}</b> đã được đóng dấu chữ ký và phê duyệt cấp <b>${level}</b>.${viewBtn}`,
            icon: 'success'
          });
        }

        // Cập nhật trạng thái và URL PDF mới trong danh sách để giữ bản vẽ trên giao diện cho phép xem lại
        if (targetRow) {
          let nextSt = 'Chờ Checker 2';
          if (level === 'Checker 2') nextSt = 'Chờ Approval';
          else if (level === 'Approval' || level === 'Approver') nextSt = 'Chờ ban hành';
          targetRow[COL_MAP.STATUS] = nextSt;
          if (signedPdfUrl) {
            targetRow[COL_MAP.PDF_LINK_AF] = signedPdfUrl;
            if (rowId) window._approvalPdfMap[rowId] = signedPdfUrl;
          }
        }
        if (typeof AppDataStore !== 'undefined') AppDataStore.invalidate('mainData');
        scheduleApprovalRender();

      } catch (err) {
        console.error('handleApprove error:', err);
        hideApprovalLoading();
        if (typeof Swal !== 'undefined') {
          const msg = (err && err.message) ? err.message : String(err);
          Swal.fire('Lỗi Đóng Dấu / Ký Duyệt', msg, 'error');
        } else {
          alert('Lỗi Đóng Dấu: ' + ((err && err.message) ? err.message : String(err)));
        }
      } finally {
        _isApprovingSingle = false;
        hideApprovalLoading();
        if (triggerBtn) {
          triggerBtn.disabled = false;
          triggerBtn.innerHTML = originalBtnHtml;
        }
      }
    };

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: 'Xác nhận Ký Phê Duyệt?',
        html: `Bạn đang ký duyệt cấp <b class="text-primary">${level}</b> cho bản vẽ: <b>${dwNo}</b>`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#10b981',
        cancelButtonColor: '#94a3b8',
        confirmButtonText: 'Approval',
        cancelButtonText: 'Cancel'
      }).then(r => { if (r.isConfirmed) doIt(); });
    } else {
      if (confirm(`Xác nhận Ký duyệt ${level} cho ${dwNo}?`)) doIt();
    }
  }

      .withSuccessHandler(() => {

      })
      .rejectDrawingOnServer(rowId, reason);

  var approvalBulkState = { selectedRows: new Set() };

  function toggleSelectAllApprovals() {
    const checkbox = document.getElementById('selectAllApprovals') || document.getElementById('headerApprovalCheckbox');
    const allCheckboxes = Array.from(document.querySelectorAll('.approval-row-checkbox:not(:disabled)'));

    approvalBulkState.selectedRows.clear();

    if (checkbox && checkbox.checked) {
      allCheckboxes.forEach(cb => {
        const rowId = cb.getAttribute('data-row-id');
        cb.checked = true;
        if (rowId) approvalBulkState.selectedRows.add(rowId);
      });
    } else {
      allCheckboxes.forEach(cb => cb.checked = false);
    }

    updateBulkApproveButtonVisibility();
  }

  function updateBulkApproveButtonVisibility() {
    const bulkBtn = document.getElementById('bulkApproveBtn');
    const allCheckboxes = document.querySelectorAll('.approval-row-checkbox');
    
    // Luôn cho phép user chọn checkboxes, chỉ ẩn nút submit nếu user không được phép bulk approve
    approvalBulkState.selectedRows.clear();
    
    allCheckboxes.forEach(cb => {
      if (cb.checked) {
        const rowId = cb.getAttribute('data-row-id');
        if (rowId) approvalBulkState.selectedRows.add(rowId);
      }
    });

    const headerCheckbox = document.getElementById('headerApprovalCheckbox');
    
    // Nếu user là Charge, ẩn nút bulk approve nhưng vẫn cho phép chọn
    if (isChargeUserBulkApproveBlocked()) {
      if (bulkBtn) bulkBtn.style.display = 'none';
      updateBulkReleaseButtonVisibility();
      // Không uncheck checkbox nữa - cho phép chọn
      return;
    }
    
    if (bulkBtn) {
      bulkBtn.style.display = approvalBulkState.selectedRows.size > 0 ? 'inline-flex' : 'none';
    }
    
    const totalCheckboxes = allCheckboxes.length;
    const checkedCount = approvalBulkState.selectedRows.size;
    
    if (headerCheckbox) {
      if (checkedCount === 0) {
        headerCheckbox.checked = false;
        headerCheckbox.indeterminate = false;
      } else if (checkedCount === totalCheckboxes) {
        headerCheckbox.checked = true;
        headerCheckbox.indeterminate = false;
      } else {
        headerCheckbox.indeterminate = true;
      }
    }

    updateBulkReleaseButtonVisibility();
  }

  function updateBulkReleaseButtonVisibility() {
    const allCheckboxes = document.querySelectorAll('.approval-row-checkbox');
    let releaseCount = 0;
    allCheckboxes.forEach(cb => {
      if (!cb.checked) return;
      const rowId = cb.getAttribute('data-row-id');
      if (!rowId) return;
      const row = (approvalRowsData || []).find(r => String(r[COL_MAP.ID] || '') === String(rowId));
      if (isReleaseEligibleRow(row)) {
        releaseCount += 1;
      }
    });

    const btn = document.getElementById('bulkReleaseBtn');
    if (btn) btn.style.display = releaseCount > 0 ? 'inline-flex' : 'none';
  }

  function openBulkApproveForm() {
    if (isChargeUserBulkApproveBlocked()) {
      if (typeof Swal !== 'undefined') {
        Swal.fire('Thông báo', 'Charge không được phép ký duyệt hàng loạt. Vui lòng ký từng bản vẽ theo từng bước.', 'warning');
      }
      return;
    }

    if (approvalBulkState.selectedRows.size === 0) {
      if (typeof Swal !== 'undefined') {
        Swal.fire('Thông báo', 'Vui lòng chọn ít nhất 1 bản vẽ để ký', 'warning');
      }
      return;
    }

    const currentPosition = normalizeApprovalLevelName((typeof user !== 'undefined' && user && user.position) ? user.position : '');
    let availableLevels = [];

    if (currentPosition === 'checker') {
      availableLevels = ['Checker'];
    } else if (currentPosition.includes('checker1') || currentPosition.includes('c1')) {
      availableLevels = ['Checker 1'];
    } else if (currentPosition.includes('checker2') || currentPosition.includes('c2')) {
      availableLevels = ['Checker 2'];
    } else if (currentPosition.includes('approval') || currentPosition.includes('approver') || currentPosition.includes('gmqa')) {
      availableLevels = ['Approval'];
    } else {
      availableLevels = ['Checker', 'Checker 1', 'Checker 2', 'Approval'];
    }

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: `Xử lý hàng loạt (${approvalBulkState.selectedRows.size} bản vẽ)`,
        html: `
          <p style="margin-bottom: 15px; text-align: left;">Chọn cấp xử lý cho <strong>${approvalBulkState.selectedRows.size}</strong> bản vẽ:</p>
          <select id="bulkApproveLevel" class="form-select" style="font-size: 0.95rem;">

        `,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#10b981',
        cancelButtonColor: '#94a3b8',
        confirmButtonText: 'Ký tất cả!',
        cancelButtonText: 'Hủy'
      }).then(result => {
        if (result.isConfirmed) {
          const selectedLevel = document.getElementById('bulkApproveLevel').value;
          handleBulkApprove(selectedLevel);
        }
      });
    }

      row.dept ||
      row.deptLq ||
      row.deptName ||
      row.departmentName ||
      row.bp ||
      row.bophan ||
      '';

    if (String(actualDept || '').trim()) {
      return String(actualDept).trim();

    return 'Không rõ bộ phận';

  function openBulkReleaseForm(selectedRowsOverride) {
    const checkedRows = Array.from(document.querySelectorAll('.approval-row-checkbox'))
      .filter(checkbox => checkbox.checked)
      .map(checkbox => {
        const rowIndex = Number(checkbox.getAttribute('data-row-index'));
        return {
          id: String(checkbox.getAttribute('data-row-id') || '').trim(),
          row: Number.isInteger(rowIndex) && rowIndex >= 0 ? approvalRowsData[rowIndex] : null
        };
      })
      .filter(item => item.id && item.row);
    const bulkIds = checkedRows.length > 0
      ? checkedRows.map(item => item.id)
      : Array.from(approvalBulkState.selectedRows);
    const bulkRows = checkedRows.length > 0
      ? checkedRows.map(item => {
        const id = item.id;
        const row = item.row;
        if (!row) return null;
        const st = cleanStr(String(row[COL_MAP.STATUS] || ''));
        if (st !== 'cho ban hanh') return null;
        return {
          rowId: String(id),
          dwNo: String(row[COL_MAP.DW_NO] || ''),
          type: String(row[COL_MAP.TYPE] || row[COL_MAP.GROUP] || ''),
          customer: String(row[COL_MAP.CUSTOMER] || ''),
          drawingRevise: String(row[COL_MAP.DRAWING_REVISE] || row[COL_MAP.VERSION] || '0').trim(),
          version: String(row[COL_MAP.VERSION] || ''),
          reqNo: String(row[COL_MAP.REQ_NO] || ''),
          project: String(row[COL_MAP.PROJECT] || ''),
          status: String(row[COL_MAP.STATUS] || ''),
          department: inferReleaseDepartmentFromRow(row)
        };
      })
      .filter(Boolean)
      : bulkIds
        .map(id => {
          const row = (approvalRowsData || []).find(r => String(r[COL_MAP.ID] || '') === String(id));
          if (!row) return null;
          const st = cleanStr(String(row[COL_MAP.STATUS] || ''));
          if (st !== 'cho ban hanh') return null;
          return {
            rowId: String(id),
            dwNo: String(row[COL_MAP.DW_NO] || ''),
            type: String(row[COL_MAP.TYPE] || row[COL_MAP.GROUP] || ''),
            customer: String(row[COL_MAP.CUSTOMER] || ''),
            drawingRevise: String(row[COL_MAP.DRAWING_REVISE] || row[COL_MAP.VERSION] || '0').trim(),
            version: String(row[COL_MAP.VERSION] || ''),
            reqNo: String(row[COL_MAP.REQ_NO] || ''),
            project: String(row[COL_MAP.PROJECT] || ''),
            status: String(row[COL_MAP.STATUS] || ''),
            department: inferReleaseDepartmentFromRow(row)
          };
        })
        .filter(Boolean);

    // Quy tắc bảo toàn: nếu chọn thực sự nhiều dòng qua bulkState, ưu tiên bulkRows.
    // Chỉ dùng explicitRows trong luồng 1 dòng (không có nhiều checkbox được chọn).
    const explicitRows = Array.isArray(selectedRowsOverride) && selectedRowsOverride.length > 0
      ? selectedRowsOverride
      : [];

    const rowsToRelease = bulkIds.length > 1 ? bulkRows : (explicitRows.length > 0 ? explicitRows : bulkRows);

    if (!rowsToRelease || rowsToRelease.length === 0) {
      if (typeof Swal !== 'undefined') Swal.fire('Thông báo', 'Không có bản vẽ nào ở trạng thái Chờ ban hành để ban hành.', 'warning');
      return;
    }

    // =========================================================
    // ĐỊNH NGHĨA CÁC BỘ PHẬN NH À MÁY (THEO HÌNH 2)
    // =========================================================
    // Bộ phận độc lập (8 cột) + nhóm FAB (5 sub) + QA = 14 cột dept
    const DEPT_STANDALONE = [
      { key: 'EX',    label: 'EX' },
      { key: 'ST',    label: 'ST' },
      { key: 'ALBar', label: 'AL Bar' },
      { key: 'PC',    label: 'PC' },
      { key: 'PP',    label: 'PP' },
      { key: 'MRDC',  label: 'MRDC' },
      { key: 'QCDI',  label: 'QCDI' },
      { key: 'QCFAB', label: 'QCFAB' }
    ];
    const DEPT_FAB = [
      { key: 'Fab-NP',     label: 'NP' },
      { key: 'Fab-MT',     label: 'MT' },
      { key: 'Fab-PC',     label: 'PC' },
      { key: 'Fab-DADORI', label: 'DADORI' },
      { key: 'Fab-PVC',    label: 'PVC' }
    ];
    const DEPT_QA = [{ key: 'QA', label: 'QA' }];
    const ALL_DEPTS = [...DEPT_STANDALONE, ...DEPT_FAB, ...DEPT_QA];
    const TOTAL_DEPT_COLS = ALL_DEPTS.length; // 14
    const commonReleaseRowId = '__common_release_selection__';

    // State lưu trạng thái ô chung cho toàn bộ bản vẽ đã chọn, vì người dùng xác nhận
    // sẽ gửi các bản vẽ với lựa chọn bộ phận chung và không cần phân tách theo từng bản vẽ.
    const deptMatrix = {};
    deptMatrix[commonReleaseRowId] = {};
    ALL_DEPTS.forEach(d => { deptMatrix[commonReleaseRowId][d.key] = false; });

    // Tự động gợi ý dựa theo loại bản vẽ (tương tự Hình 1)
    const combinedTypeText = rowsToRelease.map(row => String(row.type || '').toUpperCase()).join(' ');
    if (combinedTypeText.includes('PART') || combinedTypeText.includes('ASSEMBLY')) {
      ['EX','ST','ALBar'].forEach(k => { deptMatrix[commonReleaseRowId][k] = true; });
    } else if (combinedTypeText.includes('INDEX')) {
      ['PC','PP'].forEach(k => { deptMatrix[commonReleaseRowId][k] = true; });
    }

    // =========================================================
    // RENDER HTML MA TRẬN
    // =========================================================
    const renderMatrixTable = () => {
      // Hàng header tầng 1
      const th1Standalone = DEPT_STANDALONE.map(d =>
        `<th class="th-dept" rowspan="2" data-col-key="${d.key}" title="Click để chọn/bỏ cả cột ${d.label}" style="min-width:36px;">${d.label}</th>`
      ).join('');
      const th1FabGroup = `<th class="th-fab-group" colspan="${DEPT_FAB.length}">FAB</th>`;
      const th1QA = `<th class="th-dept" rowspan="2" data-col-key="QA" title="Click để chọn/bỏ cả cột QA" style="min-width:36px;">QA</th>`;

      // Hàng header tầng 2 (chỉ các sub FAB)
      const th2FabSubs = DEPT_FAB.map(d =>
        `<th class="th-fab-sub" data-col-key="${d.key}" title="Click để chọn/bỏ cả cột ${d.label}" style="min-width:44px;">${d.label}</th>`
      ).join('');

      // Một dòng dữ liệu chung cho toàn bộ bản vẽ được chọn
      const deptCells = ALL_DEPTS.map(d => {
        const isOn = deptMatrix[commonReleaseRowId][d.key];
        return `<td class="td-dept${isOn ? ' active' : ''}" data-row-id="${commonReleaseRowId}" data-dept-key="${d.key}">${isOn ? 'O' : ''}</td>`;
      }).join('');

      const dataRows = `
        <tr class="release-dept-row" data-row-id="${commonReleaseRowId}">
          ${deptCells}
        </tr>`;

      return `
        <table class="dw-matrix-table" id="dwMatrixTable">
          <thead>
            <tr>
              ${th1Standalone}
              ${th1FabGroup}
              ${th1QA}
            </tr>
            <tr>
              ${th2FabSubs}
            </tr>
          </thead>
          <tbody>${dataRows}</tbody>
        </table>`;
    };

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        title: `<span style="font-size:1.05rem;">🚀 Ban hành hàng loạt <span style="color:#2563eb;">(${rowsToRelease.length} bản vẽ)</span></span>`,
        html: `
          <div style="text-align:left;">
            <p class="mb-2" style="font-size:0.82rem;color:#475569;">Chọn bộ phận ban hành cho các bản vẽ đã chọn. <strong>Click vào ô</strong> để bật/tắt &bull; <strong>Click tiêu đề cột</strong> để chọn cả cột.</p>

            <div class="dw-matrix-wrap">${renderMatrixTable()}</div>

            <div class="row g-2 mt-2">
              <div class="col-sm-4">
                <label class="form-label fw-semibold mb-1" style="font-size:0.78rem;">Loại yêu cầu</label>
                <select id="releaseRequestType" class="form-select form-select-sm">
                  <option value="Normal">Normal</option>
                  <option value="Urgent">Urgent</option>
                </select>
              </div>
              <div class="col-sm-4">
                <label class="form-label fw-semibold mb-1" style="font-size:0.78rem;">Ngày gửi yêu cầu</label>
                <input id="releaseRequestDate" type="date" class="form-control form-control-sm" value="${new Date().toISOString().split('T')[0]}" readonly>
              </div>
              <div class="col-sm-4">
                <label class="form-label fw-semibold mb-1" style="font-size:0.78rem;">Ngày hoàn thành</label>
                <input id="releaseDueDate" type="date" class="form-control form-control-sm" readonly>
              </div>
            </div>
          </div>
        `,
        width: 'min(98vw, 1350px)',
        showCancelButton: true,
        confirmButtonColor: '#2563eb',
        cancelButtonColor: '#94a3b8',
        confirmButtonText: '<i class="fa fa-rocket me-1"></i> Xác nhận ban hành',
        cancelButtonText: 'Hủy',
        customClass: { popup: 'swal2-release-matrix-popup' }
      }).then(result => {
        if (result.isConfirmed) {
          const selectedType = document.getElementById('releaseRequestType').value;
          const requestDate = document.getElementById('releaseRequestDate').value || new Date().toISOString().split('T')[0];
          const dueDate = document.getElementById('releaseDueDate').value;
          const selectedDeptKeys = ALL_DEPTS.filter(d => deptMatrix[commonReleaseRowId] && deptMatrix[commonReleaseRowId][d.key])
            .map(d => d.key);
          // Gắn department từ ma trận thống nhất cho toàn bộ các bản vẽ được chọn.
          const finalRows = rowsToRelease.map(row => ({
            ...row,
            department: selectedDeptKeys.join(', ') || row.department || ''
          }));
          handleBulkRelease(finalRows, selectedType, requestDate, dueDate);
        }
      });

      setTimeout(() => {
        const requestTypeInput = document.getElementById('releaseRequestType');
        const requestDateInput = document.getElementById('releaseRequestDate');
        const dueDateInput = document.getElementById('releaseDueDate');

        const syncReleaseDates = () => {
          const selectedType = requestTypeInput.value;
          const requestDate = requestDateInput.value || new Date().toISOString().split('T')[0];
          requestDateInput.value = requestDate;

          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.withSuccessHandler(function (calcDate) {
              dueDateInput.value = calcDate || requestDate;
            }).getReleaseDueDate(requestDate, selectedType);
          } else {
            dueDateInput.value = requestDate;
          }
        };

        requestTypeInput.addEventListener('change', syncReleaseDates);
        requestDateInput.addEventListener('change', syncReleaseDates);
        syncReleaseDates();

        // =============================================
        // SỰ KIỆN CLICK Ô BỘ PHẬN - TOGGLE O
        // =============================================
        const matrixWrap = document.querySelector('.dw-matrix-wrap');
        if (!matrixWrap) return;

        matrixWrap.addEventListener('click', function(e) {
          // Click ô data (td-dept)
          const cell = e.target.closest('.td-dept');
          if (cell) {
            const rowId = cell.dataset.rowId;
            const deptKey = cell.dataset.deptKey;
            if (rowId && deptKey && deptMatrix[rowId] !== undefined) {
              const newVal = !deptMatrix[rowId][deptKey];
              deptMatrix[rowId][deptKey] = newVal;
              cell.textContent = newVal ? 'O' : '';
              cell.classList.toggle('active', newVal);
            }
            return;
          }

          // Click tiêu đề cột (th-dept hoặc th-fab-sub) → toggle cả cột theo hàng chỉ số chung.
          const colHeader = e.target.closest('[data-col-key]');
          if (colHeader) {
            const deptKey = colHeader.dataset.colKey;
            if (!deptKey) return;
            const allOn = ALL_DEPTS.every(d => d.key !== deptKey || !!deptMatrix[commonReleaseRowId][d.key]);
            const newVal = !allOn;
            deptMatrix[commonReleaseRowId][deptKey] = newVal;
            matrixWrap.querySelectorAll(`.td-dept[data-dept-key="${deptKey}"]`).forEach(td => {
              td.textContent = newVal ? 'O' : '';
              td.classList.toggle('active', newVal);
            });
          }
        });
      }, 0);
    }
  }

  function handleBulkRelease(rowsToRelease, requestType, requestDate, dueDate) {
    if (!rowsToRelease || rowsToRelease.length === 0) return;
    if (_isBulkReleasing) return;
    _isBulkReleasing = true;

    const btn = document.getElementById('bulkReleaseBtn');
    if (btn) btn.disabled = true;

    const selectedDepartments = rowsToRelease
      .map(row => String(row.department || '').trim())
      .filter(Boolean)
      .reduce((acc, cur) => {
        const list = cur.split(',').map(x => x.trim()).filter(Boolean);
        list.forEach(item => {
          if (!acc.includes(item)) acc.push(item);
        });
        return acc;
      }, []);

    const payload = [
      selectedDepartments.join(', ') || '',
      (typeof user !== 'undefined' && user && user.name) ? user.name : 'System',
      requestType || 'Normal',
      '',
      requestDate || new Date().toISOString().split('T')[0],
      dueDate || new Date(Date.now() + 86400000 * 3).toISOString().split('T')[0],
      '',
      '',
      '',
      rowsToRelease.map(row => {
        const rawRevise = String(row.drawingRevise || row.version || '0').trim();
        const drawingRevise = rawRevise.length > 0 ? rawRevise : '0';
        return [
          row.rowId,
          row.dwNo,
          drawingRevise,
          row.type,
          row.customer,
          row.reqNo || row.reqNo || '',
          row.project,
          row.department || inferReleaseDepartmentFromRow({[COL_MAP.GROUP]: row.type})
        ];
      })
    ];

    showApprovalLoading(`Đang ban hành ${rowsToRelease.length} bản vẽ lên hệ thống...`);

    google.script.run
      .withSuccessHandler(function (res) {
        _isBulkReleasing = false;
        if (btn) btn.disabled = false;
        hideApprovalLoading();
        const msg = res || 'Đã thực hiện ban hành thành công.';
        if (typeof Swal !== 'undefined') Swal.fire('Thành công', msg, 'success');
        approvalBulkState.selectedRows.clear();
        updateBulkApproveButtonVisibility();
        initSubmitApproval();
      })
      .withFailureHandler(function (err) {
        _isBulkReleasing = false;
        if (btn) btn.disabled = false;
        hideApprovalLoading();
        if (typeof Swal !== 'undefined') Swal.fire('Lỗi ban hành', err && err.message ? err.message : 'Không thể ban hành danh mục đã chọn.', 'error');
      })
      .requestReleaseDW(payload);
  }

  async function handleBulkApprove(level) {
    if (_isBulkApproving) return;

    if (isChargeUserBulkApproveBlocked()) {
      if (typeof Swal !== 'undefined') {
        Swal.fire('Thông báo', 'Charge không được phép ký duyệt hàng loạt.', 'warning');
      }
      return;
    }

    const selectedRowIds = Array.from(approvalBulkState.selectedRows);
    if (selectedRowIds.length === 0) return;

    _isBulkApproving = true;
    const bulkBtn = document.getElementById('bulkApproveBtn');
    if (bulkBtn) bulkBtn.disabled = true;

    showApprovalLoading(`Đang ký hàng loạt ${selectedRowIds.length} bản vẽ (Cấp ${level})...`);

    let successCount = 0;
    let failCount = 0;

    try {
      for (const rowId of selectedRowIds) {
        try {
          const targetRow = (approvalRowsData || []).find(r => String(r[COL_MAP.ID] || '') === String(rowId));
          if (!targetRow) {
            failCount++;
            continue;
          }

          const dwNo = targetRow[COL_MAP.DW_NO] || 'Unknown';
          const pdfUrl = String(targetRow[COL_MAP.PDF_LINK_AF] || targetRow[COL_MAP.PDF_LINK_O] || '');

          const [checker, c1, c2, c3] = getLevelStates(String(targetRow[COL_MAP.STATUS] || ''));
          if (level === 'Checker' && checker !== 'waiting') continue;
          if (level === 'Checker 1' && c1 !== 'waiting') continue;
          if (level === 'Checker 2' && c2 !== 'waiting') continue;
          if ((level === 'Approval' || level === 'Approver') && c3 !== 'waiting') continue;

          // Gọi handleApprove nhưng bỏ Swal confirm
          await new Promise(resolve => {
            handleApproveInternal(rowId, dwNo, level, pdfUrl, () => {
              successCount++;
              resolve();
            }, () => {
              failCount++;
              resolve();
            });
          });
        } catch (err) {
          failCount++;
        }
      }
    } finally {
      _isBulkApproving = false;
      if (bulkBtn) bulkBtn.disabled = false;
      hideApprovalLoading();
    }
    
    if (typeof Swal !== 'undefined') {
      Swal.fire('Hoàn thành!', `Đã ký thành công: ${successCount}/${selectedRowIds.length} bản vẽ.${failCount > 0 ? `\nLỗi: ${failCount}` : ''}`, 'success');
    }

    // Clear selection và re-render bảng để giữ bản vẽ đã ký cho phép coi lại
    approvalBulkState.selectedRows.clear();
    updateBulkApproveButtonVisibility();
    scheduleApprovalRender();
  }

  // Wrapper để gọi handleApprove mà không có Swal confirm
  async function handleApproveInternal(rowId, dwNo, level, passedPdfUrl, onSuccess, onError) {
    let posKey = String(level || '').toLowerCase().replace(/\s+/g, '');
    if (posKey.indexOf('checker1') !== -1 || posKey.indexOf('c1') !== -1) posKey = 'checker1';
    else if (posKey.indexOf('checker2') !== -1 || posKey.indexOf('c2') !== -1) posKey = 'checker2';
    else if (posKey.indexOf('approval') !== -1 || posKey.indexOf('approver') !== -1) posKey = 'approver';

    const targetRow = (approvalRowsData || []).find(r => String(r[COL_MAP.ID] || '') === String(rowId));
    const pdfUrl = (passedPdfUrl && passedPdfUrl.includes('http')) ? passedPdfUrl : (targetRow ? String(targetRow[COL_MAP.PDF_LINK_AF] || targetRow[COL_MAP.PDF_LINK_O] || '') : '');

    try {
      if (level === 'Checker') {
        await confirmCheckerOnServer(rowId);
        if (targetRow) targetRow[COL_MAP.STATUS] = 'Chờ Checker 1';
        onSuccess();
        return;
      }

      if (!pdfUrl || !pdfUrl.includes('http')) {
        throw new Error("Bản vẽ này chưa có đường dẫn file PDF!");
      }

      const userMail = (typeof user !== 'undefined' && user.mail) ? user.mail : 'System';

      // 1. Lấy Base64 của PDF và Chữ ký
      const fileData = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getFilesFromDrive(pdfUrl, userMail);
      });

      if (!fileData || !fileData.success) {
        throw new Error(fileData ? (fileData.message || 'Lỗi lấy dữ liệu PDF') : 'Không thể lấy dữ liệu');
      }

      const pdfBlob = await fetch("data:application/pdf;base64," + fileData.pdfBase64).then(res => res.blob());
      const stampBlob = await fetch("data:image/png;base64," + fileData.stampBase64).then(res => res.blob());

      // Gửi cho Python Backend: Chỉ truyền level để tự động định vị
      const formData = new FormData();
      formData.append("pdf_file", pdfBlob, "document.pdf");
      formData.append("stamp_file", stampBlob, "stamp.png");
      formData.append("level", level);

      const localApiUrl = "http://10.156.42.195:8000/quan-ly-ban-ve/signToPDW";
      const apiResponse = await fetch(localApiUrl, { method: "POST", body: formData });

      if (!apiResponse.ok) {
        throw new Error(`Local API lỗi HTTP ${apiResponse.status}`);
      }

      const contentType = String(apiResponse.headers.get('content-type') || '').toLowerCase();
      if (!contentType.includes('application/pdf') && !contentType.includes('application/octet-stream')) {
        const errorText = await apiResponse.text();
        throw new Error(`Local API không trả file PDF ký. ${errorText ? 'Chi tiết: ' + errorText : ''}`);
      }

      const signedPdfBlob = await apiResponse.blob();
      if (!signedPdfBlob || signedPdfBlob.size < 64) {
        throw new Error('Local API trả về PDF đã ký nhưng file rỗng hoặc quá nhỏ.');
      }

      const base64SignedPdf = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(signedPdfBlob);
      });

      const signedPdfUrl = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .submitForApproval(rowId, base64SignedPdf);
      });

      await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .approveDrawingOnServer(rowId, level);
      });

      // Cập nhật trạng thái và URL PDF trong targetRow
      if (targetRow) {
        let nextSt = 'Chờ Checker 2';
        if (level === 'Checker 2') nextSt = 'Chờ Approval';
        else if (level === 'Approval' || level === 'Approver') nextSt = 'Chờ ban hành';
        targetRow[COL_MAP.STATUS] = nextSt;
        if (signedPdfUrl) {
          targetRow[COL_MAP.PDF_LINK_AF] = signedPdfUrl;
          if (rowId) window._approvalPdfMap[rowId] = signedPdfUrl;
        }
      }

      onSuccess();
    } catch (err) {
      onError();
    }
  }

  window.initSubmitApproval = initSubmitApproval;
</script>
